[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bionuclei-domainrobust"
version = "0.1.0"
description = "Domain-robust nuclear instance segmentation for fluorescence bioimaging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "tifffile>=2023.7.10",
  "torch>=2.1",
  "torchvision>=0.16",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
]
mcp = [
  "mcp>=2,<3",
]
web = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
  "pillow>=10.0",
]

[project.scripts]
bionuclei = "bionuclei.cli:main"
bionuclei-mcp = "bionuclei.mcp_server:main"
bionuclei-mcp-http = "bionuclei.mcp_server:main_http"
biomcp = "biomcp.cli:main"
bionuclei-community = "webapp.community_app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
