services:
  - type: web
    name: bionuclei-biomcp
    runtime: docker
    plan: starter
    dockerfilePath: ./webapp/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BIONUCLEI_CHECKPOINT
        sync: false
      - key: BIOMCP_ALLOWED_ORIGINS
        value: https://burhanabdullah.github.io
      - key: BIOMCP_MAX_UPLOAD_BYTES
        value: "26214400"
