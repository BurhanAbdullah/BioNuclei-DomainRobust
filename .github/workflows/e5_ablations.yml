name: E5 ablations and strong baseline

# Release-integrity note: every E5 run must retain full_frozen_e4 plus every
# applicable ablation and the matched conventional comparator. Variants execute
# independently in parallel so one hosted-job wall-clock timeout cannot produce
# a partial scientific release artifact.

on:
  push:
    paths:
      - 'scripts/train_domain_robust.py'
      - 'scripts/evaluate_s_biad634.py'
      - 'scripts/metrics_instance.py'
      - 'src/bionuclei/data.py'
      - 'src/bionuclei/masks.py'
      - 'src/bionuclei/metrics.py'
      - 'configs/domain_robust.yaml'
      - 'configs/bbbc039_baseline.yaml'
      - 'scripts/e5_run_ablation.py'
      - 'docs/E5_PREREGISTRATION.md'
      - 'docs/PROGRESS.md'
      - '.github/workflows/e5_ablations.yml'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Matched E5 source-training epochs'
        required: false
        default: '20'

jobs:
  e5_variant:
    name: E5 ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant:
          - full_frozen_e4
          - no_intensity_randomization
          - no_contrast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy pandas scikit-image scikit-learn tifffile pyyaml tqdm pytest imagecodecs
          python -m pip install -e . --no-deps
      - name: Verify source dataset and split
        run: |
          python scripts/download_bbbc039.py --data-root data/raw/BBBC039
          python scripts/verify_bbbc039.py --data-root data/raw/BBBC039
          python scripts/build_bbbc039_split.py --metadata-root data/raw/BBBC039/metadata --output data/manifests/bbbc039_official_split.json
      - name: Download and inventory target dataset
        run: python scripts/download_s_biad634.py --data-root data/raw/S-BIAD634
      - name: Run preregistered E5 variant
        env:
          EPOCHS: ${{ inputs.epochs || '20' }}
        run: |
          PYTHONPATH="$PWD" python scripts/e5_run_ablation.py \
            --config configs/domain_robust.yaml \
            --manifest data/manifests/bbbc039_official_split.json \
            --target-manifest data/raw/S-BIAD634/download_manifest.json \
            --source-root data/raw/BBBC039 \
            --target-root data/raw/S-BIAD634 \
            --output outputs/e5 \
            --epochs "$EPOCHS" \
            --variant "${{ matrix.variant }}"
      - name: Verify variant completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=Path('outputs/e5') / '${{ matrix.variant }}'
          d=json.loads((v/'evaluation'/'metrics.json').read_text())
          assert d.get('n_images') == 79
          assert len(d.get('per_image', [])) == 79
          for k in ('dice','iou','precision','recall','f1_score','aji','boundary_f1'):
              assert k in d.get('mean',{}) and k in d.get('median',{})
          p=json.loads((v/'provenance.json').read_text())
          assert p.get('target_data_used_for_training') is False
          assert p.get('target_manifest_sha256')
          assert p.get('source_split_manifest_sha256')
          assert p.get('checkpoint_sha256')
          print('verified', '${{ matrix.variant }}')
          PY
      - name: Upload E5 variant artifact
        uses: actions/upload-artifact@v4
        with:
          name: e5-variant-${{ github.run_id }}-${{ matrix.variant }}
          path: |
            outputs/e5/${{ matrix.variant }}/
            outputs/e5/${{ matrix.variant }}.yaml
            configs/domain_robust.yaml
            data/manifests/bbbc039_official_split.json
            data/raw/BBBC039/download_manifest.json
            data/raw/S-BIAD634/download_manifest.json
            docs/E5_PREREGISTRATION.md
          retention-days: 30

  e5_gate:
    name: E5 completeness and comparator gate
    needs: e5_variant
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy pandas scikit-image scikit-learn tifffile pyyaml tqdm pytest imagecodecs
          python -m pip install -e . --no-deps
      - name: Download E5 variant artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: e5-variant-${{ github.run_id }}-*
          merge-multiple: true
          path: .
      - name: Verify all preregistered variants and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('outputs/e5')
          required={'full_frozen_e4','no_intensity_randomization','no_contrast'}
          assert required <= {p.name for p in root.iterdir() if p.is_dir()}
          for name in required:
              v=root/name
              d=json.loads((v/'evaluation'/'metrics.json').read_text())
              assert d['n_images']==79 and len(d['per_image'])==79
              assert all(k in d['mean'] and k in d['median'] for k in ('dice','iou','precision','recall','f1_score','aji','boundary_f1'))
              p=json.loads((v/'provenance.json').read_text())
              assert p['target_data_used_for_training'] is False
              assert p['n_target_images']==79
              for k in ('target_manifest_sha256','source_split_manifest_sha256','config_sha256','checkpoint_sha256'):
                  assert p.get(k)
          print('all preregistered E5 variants complete')
          PY
      - name: Verify matched conventional baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/download_s_biad634.py --data-root data/raw/S-BIAD634
          mkdir -p outputs/strong_baseline_source
          gh run download 33768426630 \
            --repo "$GITHUB_REPOSITORY" \
            --name bbbc039-baseline-33768426630 \
            --dir outputs/strong_baseline_source
          CKPT="outputs/strong_baseline_source/outputs/bbbc039_baseline/last.pt"
          test -f "$CKPT"
          PYTHONPATH="$PWD" python scripts/evaluate_s_biad634.py \
            --checkpoint "$CKPT" \
            --data-root data/raw/S-BIAD634 \
            --output outputs/strong_baseline_target
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          def sha256(p):
              h=hashlib.sha256(); h.update(p.read_bytes()); return h.hexdigest()
          m=json.loads(Path('outputs/strong_baseline_target/metrics.json').read_text())
          assert m['n_images']==79 and len(m['per_image'])==79
          ckpt=Path('outputs/strong_baseline_source/outputs/bbbc039_baseline/last.pt')
          prov={
            'name':'corrected_bbbc039_boundary_unet_baseline',
            'type':'conventional_boundary_aware_unet_comparator',
            'source_run_id':33768426630,
            'source_artifact_digest':'sha256:ec31fba69ee40de1f86d89ac0275d4341f58ec31a41f4129b33cf2501d3ce74f',
            'checkpoint_sha256':sha256(ckpt),
            'config_sha256':sha256(Path('configs/bbbc039_baseline.yaml')),
            'source_split_manifest_sha256':sha256(Path('data/manifests/bbbc039_official_split.json')),
            'target_manifest_sha256':sha256(Path('data/raw/S-BIAD634/download_manifest.json')),
            'decoder':'bionuclei.masks.decode_instance_mask',
            'evaluator':'scripts/evaluate_s_biad634.py',
            'target_data_used_for_training':False,
            'n_target_images':79,
          }
          Path('outputs/strong_baseline_target/provenance.json').write_text(json.dumps(prov,indent=2)+'\n')
          PY
      - name: Verify strong-baseline eligibility
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('outputs/strong_baseline_target/provenance.json').read_text())
          required=['source_run_id','source_artifact_digest','checkpoint_sha256','config_sha256','source_split_manifest_sha256','target_manifest_sha256','decoder','evaluator']
          assert all(p.get(k) for k in required)
          assert p['target_data_used_for_training'] is False
          m=json.loads(Path('outputs/strong_baseline_target/metrics.json').read_text())
          assert m['n_images']==79 and len(m['per_image'])==79
          PY
      - name: Record and upload E5 gate artifact
        run: |
          cat > outputs/e5/STRONG_BASELINE_GATE.md <<'EOF'
          # E5 strong-baseline gate

          The retained corrected BBBC039 Boundary U-Net baseline is evaluated on the
          identical 79-image S-BIAD634 target set using the corrected evaluator. Its
          source run, artifact digest, checkpoint hash, source split, target manifest,
          decoder and command provenance are retained in
          `outputs/strong_baseline_target/provenance.json`.

          Eligibility is an evidence classification: this is a conventional,
          auditable comparator, not a copied published number. No biological-group
          claim is inferred from target filenames.
          EOF
      - name: Upload E5 gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: e5-gate-${{ github.run_id }}
          path: |
            outputs/e5/
            outputs/strong_baseline_target/
            configs/domain_robust.yaml
            configs/bbbc039_baseline.yaml
            data/manifests/bbbc039_official_split.json
            data/raw/S-BIAD634/download_manifest.json
            docs/E5_PREREGISTRATION.md
          retention-days: 30
