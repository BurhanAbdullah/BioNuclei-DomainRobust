name: ECC parallel release audit

# ECC-style multi-agent release gate. Each independent lane checks one concern
# from the immutable evidence chain. The final integrator accepts readiness only
# when every lane passes. No lane may rewrite scientific result artifacts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ecc-release-${{ github.ref }}
  cancel-in-progress: false

env:
  E6_RUN_ID: "34312833206"
  E6_SOURCE_RUN_ID: "34208190019"
  E7_RUN_ID: "34312920549"
  UNCERTAINTY_RUN_ID: "34312853905"
  E6_AGGREGATE_ARTIFACT_ID: "10088980217"
  E7_ARTIFACT_ID: "10089229809"
  UNCERTAINTY_ARTIFACT_ID: "10088988731"
  REQUIRED_PYTHON: "3.11"

jobs:
  scientific:
    name: A1 Scientific evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.REQUIRED_PYTHON }}
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas scikit-image scikit-learn tifffile pyyaml tqdm
      - name: Verify statistical plan and analyzers
        run: |
          set -euo pipefail
          python -m compileall -q scripts src
          test -f docs/STATISTICAL_ANALYSIS_PLAN.md
          test -f scripts/analyze_e3_e4_statistics.py
          test -f scripts/analyze_e6_e7_uncertainty.py
      - name: Verify immutable evidence identifiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          def get(url):
              r=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(r) as h: return json.load(h)
          for aid in [os.environ['E6_AGGREGATE_ARTIFACT_ID'],os.environ['E7_ARTIFACT_ID'],os.environ['UNCERTAINTY_ARTIFACT_ID']]:
              obj=get(f'https://api.github.com/repos/{repo}/actions/artifacts/{aid}')
              assert obj['expired'] is False, aid
              assert obj['size_in_bytes'] > 0, aid
          print('scientific evidence identifiers: PASS')
          PY

  reproduction:
    name: A2 Clean-environment reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.REQUIRED_PYTHON }}
      - name: Install from package metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Environment and test verification
        run: |
          python - <<'PY'
          import sys, torch
          print(sys.version)
          print(torch.__version__)
          assert not torch.cuda.is_available()
          PY
          pytest -q
          python -m compileall -q scripts src

  provenance:
    name: A3 Provenance and artifact integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify pinned GitHub artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          expected={
            os.environ['E6_AGGREGATE_ARTIFACT_ID']: {'workflow_run': 34312833206, 'digest': 'sha256:fad1b13ae05cfcb4cfa7f958a61b027ff84751d1ff980a6d6c5d1794106f7c34'},
            os.environ['E7_ARTIFACT_ID']: {'workflow_run': 34312920549, 'digest': 'sha256:e71df73427544700809d6cd2a094b33b572c3e7d835f754482a76061dd18ede7'},
            os.environ['UNCERTAINTY_ARTIFACT_ID']: {'workflow_run': 34312853905, 'digest': 'sha256:0cbef10c50d7c254a38bf2c865d20dcac4c420010171af70a44e0e266c85d6a7'},
          }
          def get(url):
            req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req) as h:return json.load(h)
          for aid, exp in expected.items():
            o=get(f'https://api.github.com/repos/{repo}/actions/artifacts/{aid}')
            assert not o['expired'], aid
            assert o['digest']==exp['digest'], (aid,o['digest'],exp['digest'])
            assert int(o['workflow_run']['id'])==exp['workflow_run'], (aid,o['workflow_run']['id'],exp['workflow_run'])
            print(aid, o['digest'], 'run', o['workflow_run']['id'])
          PY

  claims:
    name: A4 Claims and documentation audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Detect unsupported positive claims
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          patterns=re.compile(r'\b(?:scientifically ready|proven superior|state-of-the-art|generalizes universally|clinically validated)\b',re.I)
          negation=re.compile(r'\b(?:not|no|cannot|does not|do not|never|without|not yet|not by itself)\b',re.I)
          bad=[]
          for path in [Path('README.md'),Path('docs')]:
              paths=[path] if path.is_file() else list(path.rglob('*'))
              for p in paths:
                  if p.suffix.lower() not in {'.md','.html','.txt'}: continue
                  for n,line in enumerate(p.read_text(errors='ignore').splitlines(),1):
                      if patterns.search(line) and not negation.search(line):
                          bad.append(f'{p}:{n}:{line.strip()}')
          if bad:
              print('Potential unsupported positive claims:')
              print('\n'.join(bad))
              raise SystemExit(1)
          print('claims/documentation audit: PASS')
          PY
          test -f docs/RELEASE_CHECKLIST.md
          test -f docs/METHOD_FREEZE_2026-09-04.md

  hostile_review:
    name: A5 Hostile reproducibility checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.REQUIRED_PYTHON }}
      - name: Static release checks
        run: |
          set -euo pipefail
          python -m compileall -q scripts src
          grep -Rni "E6_cross_dataset_few_shot" docs scripts .github/workflows >/dev/null
          grep -Rni "BBBC038" docs scripts .github/workflows >/dev/null
          grep -Rni "seed.*42" docs .github/workflows >/dev/null
          grep -Rni "20" docs .github/workflows >/dev/null

  integrator:
    name: ECC integrator
    needs: [scientific, reproduction, provenance, claims, hostile_review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fail closed on any lane failure
        run: |
          set -euo pipefail
          for result in '${{ needs.scientific.result }}' '${{ needs.reproduction.result }}' '${{ needs.provenance.result }}' '${{ needs.claims.result }}' '${{ needs.hostile_review.result }}'; do
            test "$result" = success || { echo "ECC lane failure: $result"; exit 1; }
          done
      - name: Publish machine-readable readiness state
        run: |
          mkdir -p ecc_release
          cat > ecc_release/readiness.json <<EOF
          {
            "status": "pass",
            "commit": "${GITHUB_SHA}",
            "lanes": {
              "scientific": "pass",
              "clean_environment_reproduction": "pass",
              "provenance": "pass",
              "claims_and_documentation": "pass",
              "hostile_reproducibility": "pass"
            },
            "e6_artifact_id": ${E6_AGGREGATE_ARTIFACT_ID},
            "e7_artifact_id": ${E7_ARTIFACT_ID},
            "uncertainty_artifact_id": ${UNCERTAINTY_ARTIFACT_ID},
            "note": "Engineering/reproducibility gate only; final scientific readiness still requires human review of the complete release audit."
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ecc-release-readiness-${{ github.run_id }}
          path: ecc_release/readiness.json
          if-no-files-found: error
          retention-days: 90
