name: Community Analyzer validation

on:
  pull_request:
    paths:
      - "webapp/community_app.py"
      - "webapp/community.py"
      - "src/bionuclei/expert_agents.py"
      - "tests/test_expert_agents_evidence.py"
      - "tests/test_community_failure_cleanup.py"
      - "docs/bionuclei-app.html"
      - "docs/assets/bionuclei-analyzer.js"
      - "docs/assets/bionuclei-specialist-verification.js"
      - ".github/workflows/community_analyzer_validation.yml"
  push:
    branches: [main]
    paths:
      - "webapp/community_app.py"
      - "webapp/auth.py"
      - "webapp/community.py"
      - "src/bionuclei/expert_agents.py"
      - "tests/test_expert_agents_evidence.py"
      - "tests/test_community_failure_cleanup.py"
      - "docs/assets/bionuclei-specialist-verification.js"
      - "docs/bionuclei-app.html"
      - "docs/bionuclei.html"
      - "docs/bionuclei-analysis.html"
      - "docs/bionuclei-formats.html"
      - "docs/bionuclei-lab.html"
      - "docs/assets/bionuclei-analyzer.js"
      - "docs/assets/bionuclei-progress.js"
      - "docs/assets/bionuclei-config.js"
      - "docs/assets/bionuclei-ui-guard.js"
      - ".github/workflows/community_analyzer_validation.yml"
  workflow_dispatch:
    inputs:
      allow_live_render:
        description: "Explicitly authorize live Render endpoint checks"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  static:
    name: Community analyzer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate Python syntax
        run: |
          set -euo pipefail
          python -m compileall -q webapp src
          echo 'Python syntax: PASS'
      - name: Test deterministic specialist evidence contract
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          PYTHONPATH=src python -m pytest -q tests/test_expert_agents_evidence.py
      - name: Validate frontend configuration
        run: |
          set -euo pipefail
          grep -q 'bionuclei-community-analyzer.onrender.com' docs/assets/bionuclei-config.js
          grep -q 'supabaseUrl:' docs/assets/bionuclei-config.js
          grep -q 'supabasePublishableKey:' docs/assets/bionuclei-config.js
          grep -q 'bionuclei-progress.js' docs/assets/bionuclei-config.js
          grep -q 'bionuclei-ui-guard.js' docs/assets/bionuclei-config.js
          grep -q 'bionuclei-app.html' docs/bionuclei-lab.html
          grep -q 'data-access-tab="signup"' docs/bionuclei-app.html
          grep -q 'data-access-tab="signin"' docs/bionuclei-app.html
          grep -q 'data-access-tab="guest"' docs/bionuclei-app.html
          grep -q 'id="analyzeButton"' docs/bionuclei-app.html
          grep -q 'id="resultPanel"' docs/bionuclei-app.html
          grep -q 'bionuclei-specialist-verification.js' docs/bionuclei-app.html
          grep -q 'verifySpecialistArtifact' docs/assets/bionuclei-analyzer.js
          grep -q 'Specialist evidence was not verified' docs/assets/bionuclei-analyzer.js
          grep -q 'X-BioNuclei-Guest-Token' docs/assets/bionuclei-analyzer.js
          grep -q '/guest-session' docs/assets/bionuclei-analyzer.js
          grep -q '/analyze' docs/assets/bionuclei-analyzer.js
          grep -q '/jobs/' docs/assets/bionuclei-analyzer.js
          grep -q 'nuclei_analysis.csv' docs/assets/bionuclei-analyzer.js
          grep -q 'segmentation_mask.tif' docs/assets/bionuclei-analyzer.js
          grep -q 'new DataTransfer' docs/assets/bionuclei-ui-guard.js
          grep -q 'selectedFile' docs/assets/bionuclei-ui-guard.js
          ! grep -qi 'localStorage' docs/assets/bionuclei-analyzer.js
          ! grep -qi 'indexedDB' docs/assets/bionuclei-analyzer.js
          node --check docs/assets/bionuclei-specialist-verification.js
          node --check docs/assets/bionuclei-analyzer.js
          node --check docs/assets/bionuclei-progress.js
          node --check docs/assets/bionuclei-ui-guard.js
          echo 'Frontend integration contract: PASS'
      - name: Validate authentication and privacy contract
        run: |
          set -euo pipefail
          grep -q 'SUPABASE_URL' webapp/auth.py
          grep -q 'SUPABASE_PUBLISHABLE_KEY' webapp/auth.py
          grep -q 'Bearer ' webapp/auth.py
          grep -q 'authenticate_optional(request)' webapp/community_app.py
          grep -q 'create_guest_token' webapp/community_app.py
          grep -q 'authenticate_guest' webapp/auth.py
          grep -q 'delete_job' webapp/community_app.py
          ! grep -q 'password.*write_text\|write_text.*password' webapp/*.py
          echo 'Authentication/privacy contract: PASS'
      - name: Validate public analysis contract
        run: |
          set -euo pipefail
          grep -q '@app.post("/guest-session")' webapp/community_app.py
          grep -q '@app.post("/analyze")' webapp/community_app.py
          grep -q '@app.get("/jobs")' webapp/community_app.py
          grep -q '@app.get("/jobs/{job_id}")' webapp/community_app.py
          grep -q '@app.get("/jobs/{job_id}/progress")' webapp/community_app.py
          grep -q '@app.delete("/jobs/{job_id}")' webapp/community_app.py
          grep -q '"progress"' webapp/community_app.py
          grep -q 'overlay.tif' webapp/community_app.py
          grep -q 'segmentation_mask.tif' webapp/community_app.py
          grep -q 'ALLOWED_UPLOAD_SUFFIXES' webapp/community.py
          grep -q 'purge_expired' webapp/community.py
          grep -q 'DEFAULT_RESULT_RETENTION_HOURS' webapp/community.py
          echo 'Analysis/result contract: PASS'
      - name: Validate scientific pipeline ordering
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('webapp/community.py').read_text(encoding='utf-8')
          required = [
              'build_plan(inference_input, analysis_modules)',
              'if plan.status == "BLOCKED":',
              'with INFERENCE_LOCK:',
              'result = predict(inference_input, checkpoint, output, device="cpu")',
              'report_summary = _extended_reports(inference_input, output, analysis_modules)',
              'expert = run_expert_agents(result)',
              'build_report(result, output)',
              '_archive(job_id)',
          ]
          positions = [src.index(item) for item in required]
          assert positions == sorted(positions), f'pipeline ordering changed: {positions}'
          assert 'weights_updated_during_analysis":False' in src
          assert 'training_reference":"Not established"' in src
          assert '_validate_specialist_artifact(result, expert)' in src
          print('Scientific pipeline ordering: PASS')
          PY
      - name: Validate failure cleanup contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('webapp/community.py').read_text(encoding='utf-8')
          assert 'finally:' in src
          assert 'image_path.unlink(missing_ok=True)' in src
          assert '(root / "input_plane.tif").unlink(missing_ok=True)' in src
          assert 'delete_job(job_id' in src
          assert 'purge_expired()' in src
          print('Failure/retention cleanup contract: PASS')
          PY

  live:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_live_render == true && github.ref == 'refs/heads/main' }}
    name: Live Render endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check service root
        run: |
          set -euo pipefail
          # Render cold starts have taken 134 seconds; keep this idempotent root
          # probe within one bounded request rather than stacking short retries.
          curl --fail --silent --show-error --connect-timeout 10 --max-time 180 \
            https://bionuclei-community-analyzer.onrender.com/ > /tmp/root.json
          grep -q '"status":"online"' /tmp/root.json
          grep -q 'guest sessions' /tmp/root.json || grep -q 'guest sessions use an ephemeral job token' /tmp/root.json
          echo 'Render root: PASS'
      - name: Check service health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --retry 5 --retry-delay 3 \
            https://bionuclei-community-analyzer.onrender.com/health > /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"account_required":false' /tmp/health.json
          grep -q '"guest_access":true' /tmp/health.json
          grep -q '"input_retention":"transient"' /tmp/health.json
          echo 'Render health: PASS'
      - name: Check guest session contract
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --retry 5 --retry-delay 3 \
            -X POST https://bionuclei-community-analyzer.onrender.com/guest-session > /tmp/guest.json
          grep -q 'guest_token' /tmp/guest.json
          grep -q '"persisted":false' /tmp/guest.json
          echo 'Render guest session: PASS'
      - name: Check authorization boundaries
        run: |
          set -euo pipefail
          code=$(curl --silent --connect-timeout 10 --max-time 20 --output /tmp/jobs.json --write-out '%{http_code}' \
            https://bionuclei-community-analyzer.onrender.com/jobs || true)
          test "$code" = "401"
          code=$(curl --silent --connect-timeout 10 --max-time 20 --output /tmp/badguest.json --write-out '%{http_code}' \
            -H 'X-BioNuclei-Guest-Token: deliberately-invalid-token' \
            https://bionuclei-community-analyzer.onrender.com/jobs || true)
          test "$code" = "401"
          echo 'Authorization boundaries: PASS'
      - name: Check algorithm contract
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 --retry 5 --retry-delay 3 \
            https://bionuclei-community-analyzer.onrender.com/algorithms > /tmp/algorithms.json
          grep -q 'nuclei' /tmp/algorithms.json
          grep -q 'morphology' /tmp/algorithms.json
          grep -q 'intensity' /tmp/algorithms.json
          echo 'Render algorithms: PASS'
      - name: Check deployed source revision on main pushes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_live_render == true && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA}"
          expected_checkpoint_sha256="7209a6990514380804210292ac208b0f3b0b0a054338a145e1916044762d7c92"
          expected_retention_hours="24"
          # Keep deployment verification inside the live job's 25-minute
          # timeout, even when the public service is cold or still stale.
          deadline=$((SECONDS + 540))
          attempt=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            health_json="$(curl --silent --show-error --connect-timeout 10 --max-time 15 \
              https://bionuclei-community-analyzer.onrender.com/health 2>/dev/null || true)"
            deployed_branch="$(printf '%s' "$health_json" | jq -r '.render_git_branch // empty' 2>/dev/null || true)"
            deployed_commit="$(printf '%s' "$health_json" | jq -r '.render_git_commit // empty' 2>/dev/null || true)"
            checkpoint_available="$(printf '%s' "$health_json" | jq -r '.checkpoint_available // false' 2>/dev/null || true)"
            checkpoint_verified="$(printf '%s' "$health_json" | jq -r '.checkpoint_verified // false' 2>/dev/null || true)"
            checkpoint_sha256="$(printf '%s' "$health_json" | jq -r '.checkpoint_sha256 // empty' 2>/dev/null || true)"
            health_retention_hours="$(printf '%s' "$health_json" | jq -r '.result_retention_hours // empty' 2>/dev/null || true)"
            if [ "$deployed_branch" = "main" ] && [[ "$deployed_commit" =~ ^[0-9a-f]{40}$ ]] \
              && git cat-file -e "${deployed_commit}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$expected" "$deployed_commit" \
              && [ "$checkpoint_available" = "true" ] \
              && [ "$checkpoint_verified" = "true" ] \
              && [ "$checkpoint_sha256" = "$expected_checkpoint_sha256" ] \
              && [ "$health_retention_hours" = "$expected_retention_hours" ]; then
              root_json="$(curl --silent --show-error --connect-timeout 10 --max-time 15 \
                https://bionuclei-community-analyzer.onrender.com/ 2>/dev/null || true)"
              root_retention_hours="$(printf '%s' "$root_json" | jq -r '.result_retention_hours // empty' 2>/dev/null || true)"
              if [ "$root_retention_hours" = "$expected_retention_hours" ]; then
                echo "Render deployment verified: commit=${deployed_commit}, checkpoint_sha256=${checkpoint_sha256}, result_retention_hours=${health_retention_hours} (attempt ${attempt})."
                exit 0
              fi
            fi
            echo "Render not yet on the required release contract (attempt ${attempt}): branch=${deployed_branch:-unknown}, commit=${deployed_commit:-unknown}, checkpoint_available=${checkpoint_available:-unknown}, checkpoint_verified=${checkpoint_verified:-unknown}, checkpoint_sha256=${checkpoint_sha256:-unknown}, health_retention_hours=${health_retention_hours:-unknown}."
            sleep 10
          done
          echo "::error::Render does not serve current main with the pinned checkpoint and configured 24-hour result retention within 9 minutes."
          echo "Check the Render service's linked repository/branch, auto-deploy setting, and latest failed deploy."
          exit 1
