name: BBBC039 baseline experiment

on:
  push:
    paths:
      - 'src/**'
      - 'scripts/train_bbbc039.py'
      - 'scripts/evaluate_bbbc039.py'
      - 'scripts/bootstrap_metrics.py'
      - 'scripts/build_bbbc039_split.py'
      - 'scripts/download_bbbc039.py'
      - 'scripts/verify_bbbc039.py'
      - 'configs/bbbc039_baseline.yaml'
      - 'pyproject.toml'
      - '.github/workflows/bbbc039_baseline.yml'
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Training epochs for the reproducible run'
        required: false
        default: '20'
      seed:
        description: 'Random seed'
        required: false
        default: '42'

jobs:
  train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy pandas scikit-image scikit-learn tifffile pyyaml tqdm pytest imagecodecs
          python -m pip install -e . --no-deps
          python - <<'PY'
          import torch
          print(f'torch={torch.__version__}, cuda_available={torch.cuda.is_available()}')
          assert not torch.cuda.is_available(), 'Hosted baseline must remain CPU-only for reproducibility'
          PY
      - name: Download official BBBC039v1 archives
        run: python scripts/download_bbbc039.py --data-root data/raw/BBBC039
      - name: Verify dataset and build official manifest
        run: |
          python scripts/verify_bbbc039.py --data-root data/raw/BBBC039
          python scripts/build_bbbc039_split.py \
            --metadata-root data/raw/BBBC039/metadata \
            --output data/manifests/bbbc039_official_split.json
      - name: Train boundary-aware U-Net baseline
        env:
          EPOCHS: ${{ inputs.epochs || '20' }}
        run: |
          python scripts/train_bbbc039.py \
            --config configs/bbbc039_baseline.yaml \
            --manifest data/manifests/bbbc039_official_split.json \
            --data-root data/raw/BBBC039 \
            --output outputs/bbbc039_baseline \
            --epochs "$EPOCHS"
      - name: Evaluate held-out test set
        run: |
          python scripts/evaluate_bbbc039.py \
            --checkpoint outputs/bbbc039_baseline/last.pt \
            --manifest data/manifests/bbbc039_official_split.json \
            --data-root data/raw/BBBC039 \
            --split test \
            --output outputs/bbbc039_eval
      - name: Evaluate validation set
        run: |
          python scripts/evaluate_bbbc039.py \
            --checkpoint outputs/bbbc039_baseline/last.pt \
            --manifest data/manifests/bbbc039_official_split.json \
            --data-root data/raw/BBBC039 \
            --split validation \
            --output outputs/bbbc039_eval
      - name: Compute image-level test confidence intervals
        run: |
          python scripts/bootstrap_metrics.py \
            --metrics outputs/bbbc039_eval/test_metrics.json \
            --output outputs/bbbc039_eval/test_bootstrap_ci.json \
            --iterations 2000 \
            --seed 42
      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bbbc039-baseline-${{ github.run_id }}
          path: |
            outputs/bbbc039_baseline/
            outputs/bbbc039_eval/
            data/manifests/bbbc039_official_split.json
            data/raw/BBBC039/download_manifest.json
            data/raw/BBBC039/verification_report.json
          retention-days: 30
