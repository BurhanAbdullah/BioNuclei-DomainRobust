name: E6 25pct retry watchdog

on:
  workflow_run:
    workflows: ["E6 external fluorescence few-shot adaptation"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  retry-25pct:
    if: >-
      ${github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 5}
    runs-on: ubuntu-latest
    steps:
      - name: Retry only failed 25pct job
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.name == "E6 25pct") | select(.conclusion != "success") | .id')"
          test -n "${jobs}"
          while IFS= read -r job_id; do
            [ -z "${job_id}" ] && continue
            echo "Retrying E6 25pct job ${job_id} from workflow run ${RUN_ID}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/rerun" >/dev/null
          done <<< "${jobs}"
