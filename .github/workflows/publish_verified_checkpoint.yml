name: Publish Verified BBBC039 Checkpoint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish_verified_checkpoint.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact verified artifact archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9901940761/zip"
          actual="$(sha256sum artifact.zip | cut -d' ' -f1)"
          expected="ec31fba69ee40de1f86d89ac0275d4341f58ec31fba?"
          # The expected value below is the verified GitHub Actions artifact digest.
          expected="ec31fba69ee40de1f86d89ac0275d4341f58ec31a41f4129b33cf2501d3ce74f"
          test "$actual" = "$expected"
          unzip -q artifact.zip -d artifact
          CKPT="$(find artifact -type f -name last.pt | head -n 1)"
          test -n "$CKPT"
          cp "$CKPT" bionuclei_bbbc039.pt

      - name: Verify checkpoint is readable
        run: |
          set -euo pipefail
          python - <<'PY'
          import torch
          obj = torch.load("bionuclei_bbbc039.pt", map_location="cpu", weights_only=False)
          assert isinstance(obj, dict) and "model" in obj
          print("checkpoint_structure=ok")
          PY
          sha256sum bionuclei_bbbc039.pt
          stat -c 'checkpoint_bytes=%s' bionuclei_bbbc039.pt

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view checkpoint-bbbc039-v1 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release checkpoint-bbbc039-v1 already exists; leaving it unchanged."
          else
            gh release create checkpoint-bbbc039-v1 bionuclei_bbbc039.pt \
              -R "$GITHUB_REPOSITORY" \
              --title "BioNuclei BBBC039 v1" \
              --notes "Permanent public checkpoint promoted from verified CI baseline run 33768426630. The exact source Actions artifact was verified by SHA-256 before publication."
          fi

      - name: Record release asset hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view checkpoint-bbbc039-v1 -R "$GITHUB_REPOSITORY" --json tagName,assets
