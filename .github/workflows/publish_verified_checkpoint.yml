name: Verify permanent BBBC039 checkpoint release

# The original Actions artifact has a 30-day retention period. The published
# release asset is the permanent source for downstream E5 comparator runs.
# This workflow verifies the immutable release rather than depending on an
# expired Actions artifact ID or attempting to overwrite an existing release.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish_verified_checkpoint.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve and verify permanent release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_digest="sha256:7209a6990514380804210292ac208b0f3b0b0a054338a145e1916044762d7c92"
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/checkpoint-bbbc039-v1/bionuclei_bbbc039.pt"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/checkpoint-bbbc039-v1")"
          tag="$(jq -r '.tag_name' <<<"$release")"
          test "$tag" = "checkpoint-bbbc039-v1"
          asset_count="$(jq '[.assets[] | select(.name == "bionuclei_bbbc039.pt")] | length' <<<"$release")"
          test "$asset_count" = "1"
          digest="$(jq -r '.assets[] | select(.name == "bionuclei_bbbc039.pt") | .digest' <<<"$release")"
          url="$(jq -r '.assets[] | select(.name == "bionuclei_bbbc039.pt") | .browser_download_url' <<<"$release")"
          size="$(jq -r '.assets[] | select(.name == "bionuclei_bbbc039.pt") | .size' <<<"$release")"
          test "$digest" = "$expected_digest" || { echo "Published release digest mismatch: $digest"; exit 1; }
          test "$url" = "$expected_url"
          test "$size" = "7743145"
          curl --fail --location --silent --show-error --retry 3 "$url" --output bionuclei_bbbc039.pt
          actual="sha256:$(sha256sum bionuclei_bbbc039.pt | cut -d' ' -f1)"
          test "$actual" = "$expected_digest"
          test "$(stat -c '%s' bionuclei_bbbc039.pt)" = "$size"
          echo "Permanent BBBC039 release: PASS"
          echo "tag=$tag"
          echo "asset=bionuclei_bbbc039.pt"
          echo "digest=$actual"
          echo "size_bytes=$size"
