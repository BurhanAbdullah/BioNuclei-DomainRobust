name: BioMCP CI

on:
  push:
    paths:
      - 'src/biomcp/**'
      - 'src/bionuclei/mcp_server.py'
      - 'tests/test_biomcp_cli.py'
      - 'pyproject.toml'
      - 'biomcp/**'
      - '.github/workflows/biomcp-ci.yml'
  pull_request:
    paths:
      - 'src/biomcp/**'
      - 'src/bionuclei/mcp_server.py'
      - 'tests/test_biomcp_cli.py'
      - 'pyproject.toml'
      - 'biomcp/**'
      - '.github/workflows/biomcp-ci.yml'

jobs:
  cli-and-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: CLI smoke tests
        run: pytest -q tests/test_biomcp_cli.py
      - name: Static package checks
        run: |
          python -m biomcp --version
          python -m biomcp list
          python -m biomcp install --path /tmp/biomcp-mcp.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/biomcp-mcp.json'))
          assert 'biomcp_bionuclei' in p['mcpServers']
          assert p['mcpServers']['biomcp_bionuclei']['command'] == 'bionuclei-mcp'
          PY
