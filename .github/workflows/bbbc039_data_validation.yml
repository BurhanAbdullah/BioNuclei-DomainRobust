name: BBBC039 data validation

on:
  push:
    paths:
      - '.github/workflows/bbbc039_data_validation.yml'
      - 'scripts/download_bbbc039.py'
      - 'scripts/verify_bbbc039.py'
      - 'scripts/build_bbbc039_split.py'
      - 'scripts/inspect_bbbc039_layout.py'
  workflow_dispatch:
    inputs:
      keep_archives:
        description: Keep downloaded ZIP archives for provenance inspection
        required: false
        default: false
        type: boolean

jobs:
  validate-bbbc039:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Download official BBBC039v1 archives
        env:
          KEEP_ARCHIVES: ${{ inputs.keep_archives || 'false' }}
        run: |
          if [ "$KEEP_ARCHIVES" = "true" ]; then
            python scripts/download_bbbc039.py --keep-archives
          else
            python scripts/download_bbbc039.py
          fi
      - name: Inspect downloaded layout
        run: |
          python scripts/inspect_bbbc039_layout.py \
            --data-root data/raw/BBBC039 \
            --output data/raw/BBBC039/layout_report.json
      - name: Verify images, masks, metadata, and official split
        run: |
          python scripts/verify_bbbc039.py \
            --data-root data/raw/BBBC039 \
            --output data/raw/BBBC039/verification_report.json
          python scripts/build_bbbc039_split.py \
            --metadata-root data/raw/BBBC039/metadata \
            --output data/manifests/bbbc039_official_split.json
      - name: Upload verification and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbbc039-verification-${{ github.run_id }}
          path: |
            data/raw/BBBC039/download_manifest.json
            data/raw/BBBC039/layout_report.json
            data/raw/BBBC039/verification_report.json
            data/manifests/bbbc039_official_split.json
          if-no-files-found: warn
