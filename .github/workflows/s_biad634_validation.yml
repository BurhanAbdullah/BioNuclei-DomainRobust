name: S-BIAD634 target-domain validation

on:
  push:
    paths:
      - 'scripts/download_s_biad634.py'
      - 'scripts/profile_s_biad634.py'
      - 'src/bionuclei/data.py'
      - 'src/bionuclei/masks.py'
      - '.github/workflows/s_biad634_validation.yml'
  workflow_dispatch:

jobs:
  inventory-and-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install profiling dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy tifffile scikit-image imagecodecs
          python -m pip install -e . --no-deps
      - name: Record run provenance
        run: |
          python - <<'PY'
          import json
          import platform
          import subprocess
          import sys
          from pathlib import Path
          import bionuclei

          def git_revision(path):
              return subprocess.check_output(
                  ['git', '-C', str(path), 'rev-parse', 'HEAD'], text=True
              ).strip()

          root = Path('.').resolve()
          provenance = {
              'repository': 'BurhanAbdullah/BioNuclei-DomainRobust',
              'git_commit': git_revision(root),
              'python': sys.version,
              'platform': platform.platform(),
              'bionuclei_version': getattr(bionuclei, '__version__', 'unknown'),
          }
          Path('outputs').mkdir(parents=True, exist_ok=True)
          Path('outputs/s_biad634_profile_run_provenance.json').write_text(
              json.dumps(provenance, indent=2) + '\n'
          )
          print(json.dumps(provenance, indent=2))
          PY
      - name: Download and inventory S-BIAD634
        run: python scripts/download_s_biad634.py --data-root data/raw/S-BIAD634
      - name: Profile target-domain image and annotation properties
        run: |
          python scripts/profile_s_biad634.py \
            --data-root data/raw/S-BIAD634 \
            --output outputs/s_biad634_domain_profile.json
      - name: Require complete target-domain profile
        run: |
          test -s outputs/s_biad634_domain_profile.json
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('outputs/s_biad634_domain_profile.json').read_text())
          n = d.get('raw_groundtruth_pairs')
          assert n == 79, f'Expected 79 target image/ground-truth pairs, got {n!r}'
          records = d.get('per_image', [])
          assert len(records) == 79, f'Expected 79 per-image records, got {len(records)}'
          required = {
              'shape', 'dtype', 'channel_count', 'channel_axis', 'channel_stats',
              'mask_dtype', 'mask_shape', 'mask_encoding', 'annotation_objects',
              'annotation_foreground_fraction', 'annotation_area_median',
          }
          missing = required - set(records[0]) if records else required
          assert not missing, f'Missing profile fields: {sorted(missing)}'
          assert all(r['mask_encoding'].startswith('instance_labels_or_rgb_colors_decoded_by_') for r in records), 'Profile must record the canonical instance-mask decoder'
          assert all(r['annotation_objects'] >= 0 for r in records), 'Annotation object counts must be non-negative'
          assert all(len(r['shape']) in (2, 3) for r in records), 'Image shapes must be 2D or channel-last 3D'
          assert all(len(r['shape']) == 2 or r['shape'][-1] in (3, 4) for r in records), '3D image shapes must have RGB/RGBA channel dimension'
          assert all(len(r['mask_shape']) in (2, 3) for r in records), 'Raw mask shapes must be 2D labels or 3D RGB/RGBA arrays'
          assert all(len(r['mask_shape']) == 2 or r['mask_shape'][-1] in (3, 4) for r in records), '3D raw masks must have RGB/RGBA channel dimension'
          assert all(r['shape'][:2] == r['mask_shape'][:2] for r in records), 'Image and mask spatial dimensions must agree'
          assert all(r['channel_count'] == (r['shape'][-1] if len(r['shape']) == 3 else 1) for r in records), 'Channel count must match image shape'
          print(f'Verified complete 79-image target-domain profile with canonical mask decoding: {len(records)} records.')
          PY
      - name: Upload provenance and domain profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-biad634-profile-${{ github.run_id }}
          path: |
            data/raw/S-BIAD634/download_manifest.json
            outputs/s_biad634_domain_profile.json
            outputs/s_biad634_profile_run_provenance.json
          retention-days: 30
