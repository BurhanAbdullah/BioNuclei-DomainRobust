name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and web test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint deploy/render-cpu-constraints.txt -e '.[test,web]'
      - name: Verify CPU-only PyTorch
        run: |
          python - <<'PY'
          import torch

          if torch.version.cuda is not None:
              raise SystemExit(
                  f"CI must use CPU-only PyTorch, found CUDA runtime {torch.version.cuda!r}"
              )
          print(f"CPU-only PyTorch: {torch.__version__}")
          PY
      - name: Run tests
        run: pytest -q
