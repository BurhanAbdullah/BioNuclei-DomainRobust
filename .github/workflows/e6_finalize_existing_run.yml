name: E6 retained-run finalizer alias

# Compatibility alias for the historical workflow name. The old implementation
# was permanently pinned to artifacts from run 34208190019, which have expired.
# Delegate to the maintained finalizer after validating a successful source run.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Optional successful E6 source run ID; empty selects the latest successful main run"
        required: false
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve and validate source E6 run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          source_run_id="$INPUT_RUN_ID"
          if [ -z "$source_run_id" ]; then
            source_run_id="$(gh run list --workflow e6_external_few_shot.yml --branch main --status success --json databaseId --limit 1 --jq '.[0].databaseId')"
          fi
          test -n "$source_run_id" && test "$source_run_id" != "null" || {
            echo "No successful E6 source run is available; no aggregate was generated."
            exit 1
          }
          source="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}")"
          test "$(jq -r '.conclusion' <<<"$source")" = "success"
          test "$(jq -r '.head_branch' <<<"$source")" = "main"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "Verified successful E6 source run $source_run_id on main."
      - name: Dispatch the maintained verified finalizer
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
        run: |
          set -euo pipefail
          gh workflow run e6_finalize_verified.yml --ref main -f "source_run_id=${SOURCE_RUN_ID}"
          echo "Dispatched e6_finalize_verified.yml for source run ${SOURCE_RUN_ID}."
          echo "The finalizer validates the exact live artifacts and remains the authority on success/failure."
