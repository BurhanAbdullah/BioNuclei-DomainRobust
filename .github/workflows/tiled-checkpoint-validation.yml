name: Tiled inference checkpoint validation

on:
  pull_request:
    paths:
      - "src/bionuclei/inference.py"
      - "src/bionuclei/postprocessing.py"
      - "src/bionuclei/adaptive_agent.py"
      - "src/bionuclei/expert_agents.py"
      - "src/bionuclei/models.py"
      - "webapp/community.py"
      - "webapp/app.py"
      - "webapp/community_app.py"
      - "webapp/Dockerfile"
      - "webapp/community.Dockerfile"
      - "deploy/render-cpu-constraints.txt"
      - "scripts/validate_tiled_checkpoint.py"
      - "tests/test_tiled_checkpoint_validation.py"
      - ".github/workflows/tiled-checkpoint-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/bionuclei/inference.py"
      - "src/bionuclei/postprocessing.py"
      - "src/bionuclei/adaptive_agent.py"
      - "src/bionuclei/expert_agents.py"
      - "src/bionuclei/models.py"
      - "webapp/community.py"
      - "webapp/app.py"
      - "webapp/community_app.py"
      - "webapp/Dockerfile"
      - "webapp/community.Dockerfile"
      - "deploy/render-cpu-constraints.txt"
      - "scripts/validate_tiled_checkpoint.py"
      - "tests/test_tiled_checkpoint_validation.py"
      - ".github/workflows/tiled-checkpoint-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiled-checkpoint-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  released-checkpoint:
    name: Real checkpoint → uint16 measurements → eight evidence-bound specialists
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Download and verify immutable release checkpoint
        env:
          CHECKPOINT_URL: https://github.com/${{ github.repository }}/releases/download/checkpoint-bbbc039-v1/bionuclei_bbbc039.pt
          EXPECTED_SHA256: 7209a6990514380804210292ac208b0f3b0b0a054338a145e1916044762d7c92
          CHECKPOINT_PATH: ${{ runner.temp }}/bionuclei_bbbc039.pt
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            "$CHECKPOINT_URL" --output "$CHECKPOINT_PATH"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$CHECKPOINT_PATH" | sha256sum --check --strict
          echo "BIONUCLEI_CHECKPOINT=$CHECKPOINT_PATH" >> "$GITHUB_ENV"
          echo "BIONUCLEI_EXPECTED_CHECKPOINT_SHA256=$EXPECTED_SHA256" >> "$GITHUB_ENV"

      - name: Install production web dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint deploy/render-cpu-constraints.txt -e '.[web]'
          python -c 'import torch; assert torch.version.cuda is None, "Checkpoint validation must match the CPU-only Render runtime"'

      - name: Verify immutable checkpoint through real community startup
        env:
          BIONUCLEI_CHECKPOINT_SHA256: "7209a6990514380804210292ac208b0f3b0b0a054338a145e1916044762d7c92"
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import time

          from webapp import community_app

          expected = os.environ["BIONUCLEI_CHECKPOINT_SHA256"]

          async def verify_startup() -> None:
              started = time.monotonic()
              async with community_app.app.router.lifespan_context(community_app.app):
                  payload = community_app.health()
              elapsed = round(time.monotonic() - started, 3)
              evidence = {
                  "startup_seconds": elapsed,
                  "status": payload.get("status"),
                  "checkpoint_available": payload.get("checkpoint_available"),
                  "checkpoint_verified": payload.get("checkpoint_verified"),
                  "checkpoint_sha256": payload.get("checkpoint_sha256"),
              }
              print(json.dumps(evidence, sort_keys=True))
              if (
                  payload.get("status") != "ok"
                  or payload.get("checkpoint_available") is not True
                  or payload.get("checkpoint_verified") is not True
                  or payload.get("checkpoint_sha256") != expected
              ):
                  raise SystemExit("community startup did not verify the immutable release checkpoint")
              if elapsed > 110:
                  raise SystemExit(f"checkpoint verification startup exceeded 110 seconds: {elapsed}s")

          asyncio.run(verify_startup())
          PY

      - name: Run real checkpoint worker and specialist evidence gate
        id: checkpoint_validation
        env:
          BIONUCLEI_VALIDATION_EVIDENCE_DIR: ${{ runner.temp }}/bionuclei-checkpoint-validation-evidence
        run: python scripts/validate_tiled_checkpoint.py

      # The API and community services are separate Render images; build both.
      - name: Build production API image and verify CPU-only PyTorch
        run: |
          set -euo pipefail
          docker build --file webapp/Dockerfile --tag bionuclei-api-image .

      - name: Run production API image health check with the pinned checkpoint
        env:
          EXPECTED_SHA256: 7209a6990514380804210292ac208b0f3b0b0a054338a145e1916044762d7c92
        run: |
          set -euo pipefail
          container_name="bionuclei-api-health-${GITHUB_RUN_ID:-local}"
          health_file="$RUNNER_TEMP/bionuclei-api-health.json"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }

          docker run --detach --name "$container_name" \
            --publish 127.0.0.1:18000:8000 \
            --env BIONUCLEI_CHECKPOINT_SHA256="$EXPECTED_SHA256" \
            --volume "$BIONUCLEI_CHECKPOINT:/opt/models/bionuclei.pt:ro" \
            bionuclei-api-image >/dev/null
          trap cleanup EXIT

          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            if curl --fail --silent --connect-timeout 2 --max-time 5 \
              --output "$health_file" http://127.0.0.1:18000/health; then
              if EXPECTED_SHA256="$EXPECTED_SHA256" HEALTH_FILE="$health_file" python - <<'PY'
          import json
          import os

          with open(os.environ["HEALTH_FILE"], encoding="utf-8") as stream:
              payload = json.load(stream)

          expected = os.environ["EXPECTED_SHA256"]
          evidence = {
              "status": payload.get("status"),
              "checkpoint_available": payload.get("checkpoint_available"),
              "checkpoint_verified": payload.get("checkpoint_verified"),
              "checkpoint_sha256": payload.get("checkpoint_sha256"),
          }
          print(json.dumps(evidence, sort_keys=True))
          if evidence["status"] != "ok":
              raise SystemExit("API container health status is not ok")
          if evidence["checkpoint_available"] is not True:
              raise SystemExit("API container cannot see the mounted release checkpoint")
          if evidence["checkpoint_verified"] is not True:
              raise SystemExit("API container did not verify the immutable release checkpoint")
          if evidence["checkpoint_sha256"] != expected:
              raise SystemExit("API container checkpoint digest differs from the pinned release")
          PY
              then
                echo "Production API container health and checkpoint pin: PASS"
                exit 0
              else
                echo "Production API container returned an invalid health payload" >&2
                docker logs "$container_name" >&2 || true
                exit 1
              fi
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]; then
              echo "Production API container exited before health became ready" >&2
              docker logs "$container_name" >&2 || true
              exit 1
            fi
            sleep 2
          done

          echo "Production API container did not become healthy within 180 seconds" >&2
          docker logs "$container_name" >&2 || true
          exit 1

      - name: Build production community image for constrained-memory validation
        run: |
          set -euo pipefail
          docker build --file webapp/community.Dockerfile --tag bionuclei-memory-gate .

      - name: Run real checkpoint worker with a 480 MiB hard memory limit
        id: memory_validation
        env:
          EXPECTED_SHA256: 7209a6990514380804210292ac208b0f3b0b0a054338a145e1916044762d7c92
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/bionuclei-checkpoint-validation-evidence"
          VALIDATOR_DIR="$RUNNER_TEMP/bionuclei-validation-scripts"
          mkdir -p "$EVIDENCE_DIR" "$VALIDATOR_DIR"
          cp scripts/validate_tiled_checkpoint.py "$VALIDATOR_DIR/validate_tiled_checkpoint.py"

          last_status=1
          for attempt in 1 2; do
            echo "Constrained-memory validation attempt ${attempt}/2"
            if docker run --rm \
              --memory=503316480 \
              --memory-swap=503316480 \
              --cpus=1 \
              --pids-limit=256 \
              --env BIONUCLEI_CHECKPOINT=/checkpoint.pt \
              --env BIONUCLEI_EXPECTED_CHECKPOINT_SHA256="$EXPECTED_SHA256" \
              --volume "$BIONUCLEI_CHECKPOINT:/checkpoint.pt:ro" \
              --volume "$VALIDATOR_DIR:/app/scripts:ro" \
              --volume "$EVIDENCE_DIR:/evidence" \
              bionuclei-memory-gate \
              sh -lc '
                env_status=0
                for variable in OMP_NUM_THREADS MKL_NUM_THREADS OPENBLAS_NUM_THREADS NUMEXPR_NUM_THREADS; do
                  value="$(printenv "$variable" 2>/dev/null || true)"
                  echo "Production image $variable=$value"
                  if [ "$value" != "1" ]; then
                    env_status=1
                  fi
                done
                set +e
                if [ "$env_status" -eq 0 ]; then
                  python scripts/validate_tiled_checkpoint.py
                  worker_status=$?
                else
                  echo "Production image thread-pool defaults are not all set to 1" >&2
                  worker_status=1
                fi
                set -e
                if [ -r /sys/fs/cgroup/memory.max ] && [ -r /sys/fs/cgroup/memory.peak ]; then
                  memory_limit=$(cat /sys/fs/cgroup/memory.max)
                  memory_peak=$(cat /sys/fs/cgroup/memory.peak)
                  memory_source="cgroup_v2"
                elif [ -r /sys/fs/cgroup/memory/memory.limit_in_bytes ] && [ -r /sys/fs/cgroup/memory/memory.max_usage_in_bytes ]; then
                  memory_limit=$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)
                  memory_peak=$(cat /sys/fs/cgroup/memory/memory.max_usage_in_bytes)
                  memory_source="cgroup_v1"
                else
                  echo "Cannot verify cgroup memory accounting; refusing a false pass" >&2
                  exit 1
                fi
                case "$memory_limit" in ""|*[!0-9]*) echo "Invalid cgroup memory limit: $memory_limit" >&2; exit 1;; esac
                case "$memory_peak" in ""|*[!0-9]*) echo "Invalid cgroup memory peak: $memory_peak" >&2; exit 1;; esac
                printf "Cgroup memory limit: %s bytes\\n" "$memory_limit"
                printf "Cgroup memory peak: %s bytes\\n" "$memory_peak"
                printf "{\"limit_bytes\":%s,\"peak_bytes\":%s,\"accounting_source\":\"%s\"}\n" "$memory_limit" "$memory_peak" "$memory_source" > /evidence/cgroup-memory.json
                [ "$worker_status" -eq 0 ] || exit "$worker_status"
                [ "$memory_limit" -eq 503316480 ] || { echo "Expected an enforced 480 MiB cgroup limit" >&2; exit 1; }
                [ "$memory_peak" -le 492830720 ] || { echo "Cgroup peak exceeded 470 MiB safety target" >&2; exit 1; }
              '
            then
              echo "Constrained-memory validation attempt ${attempt}/2 passed"
              exit 0
            else
              last_status=$?
              echo "Constrained-memory validation attempt ${attempt}/2 failed with exit status ${last_status}" >&2
            fi
          done
          exit "$last_status"

      - name: Persist constrained-memory evidence in the runner manifest
        id: persist_memory_evidence
        if: steps.checkpoint_validation.outcome == 'success' && steps.memory_validation.outcome == 'success'
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/bionuclei-checkpoint-validation-evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.validate_tiled_checkpoint import persist_cgroup_memory_evidence

          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          memory = json.loads((evidence_dir / "cgroup-memory.json").read_text(encoding="utf-8"))
          persisted = persist_cgroup_memory_evidence(
              evidence_dir,
              memory.get("limit_bytes"),
              memory.get("peak_bytes"),
              memory.get("accounting_source"),
          )
          print(json.dumps(persisted, indent=2, sort_keys=True))
          PY

      - name: Upload verified runner-only checkpoint evidence
        if: always() && steps.checkpoint_validation.outcome == 'success' && steps.memory_validation.outcome == 'success' && steps.persist_memory_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bionuclei-checkpoint-validation-evidence/
          if-no-files-found: error
          retention-days: 7
