name: Live public agent E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/live_public_agent_e2e.py"
      - "scripts/render_runtime_parity.py"
      - "scripts/public_e2e_schedule_watchdog.py"
      - "tests/test_render_runtime_parity.py"
      - "tests/test_public_e2e_schedule_watchdog.py"
      - "webapp/community.Dockerfile"
      - "webapp/Dockerfile"
      - "render.yaml"
      - ".github/workflows/live-public-agent-e2e.yml"
      - ".github/workflows/public-e2e-schedule-watchdog.yml"

permissions:
  contents: read
concurrency:
  group: live-public-agent-e2e
  # Queue revisions until the current disposable analysis has finished, so a
  # newly fixed harness does not cancel a live GPU/CPU inference mid-run.
  cancel-in-progress: false
jobs:
  # Pull requests validate the harness offline and never contact the public service.
  validate-harness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile public E2E, parity helper, and watchdog
        run: python -m py_compile scripts/live_public_agent_e2e.py scripts/render_runtime_parity.py scripts/public_e2e_schedule_watchdog.py
      - name: Test Docker-aware runtime path classification and dispatch pause
        run: python -m unittest discover -s tests -p 'test_render_runtime_parity.py' -v
      - name: Test watchdog decisions
        run: python -m unittest discover -s tests -p 'test_public_e2e_schedule_watchdog.py' -v
      - name: Validate workflow YAML syntax
        run: ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); YAML.parse_file(ARGV.fetch(1)); puts "YAML syntax OK"' .github/workflows/live-public-agent-e2e.yml .github/workflows/public-e2e-schedule-watchdog.yml

  public-upload-to-agent:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'BurhanAbdullah/BioNuclei-DomainRobust' && github.ref == 'refs/heads/main' }}
    name: Public upload → real inference → verified specialists → UI/reports
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install browser E2E dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy tifffile requests playwright "pypdf>=5.0"
          python -m playwright install --with-deps chromium
      - name: Validate test syntax
        run: python -m py_compile scripts/live_public_agent_e2e.py
      - name: Exercise public upload and real scientific pipeline
        env:
          BIONUCLEI_PUBLIC_SITE_URL: https://burhanabdullah.github.io/BioNuclei-DomainRobust/bionuclei-app.html
          BIONUCLEI_PUBLIC_API_URL: https://bionuclei-community-analyzer.onrender.com
          BIONUCLEI_ANALYSIS_TIMEOUT_MS: "1200000"
          BIONUCLEI_JOB_STALL_TIMEOUT_SECONDS: "240"
        run: python scripts/live_public_agent_e2e.py
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-public-agent-e2e-failure-${{ github.run_id }}
          path: |
            live-agent-e2e-failure.png
            live-agent-e2e-failure.json
          if-no-files-found: ignore
          retention-days: 7
