name: Live public agent E2E

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "webapp/**"
      - "src/**"
      - "pyproject.toml"
      - "README.md"
      - "configs/**"
      - "render.yaml"
      - "docs/RESEARCH_PROTOCOL.md"
      - "docs/DATASETS.md"
      - "docs/bionuclei-app.html"
      - "docs/assets/bionuclei-analyzer.js"
      - "docs/assets/bionuclei-specialist-verification.js"
      - "scripts/live_public_agent_e2e.py"
      - "scripts/check_public_e2e_runtime.py"
      - "scripts/github_api_auth.py"
      - "scripts/e2e_health_state.py"
      - "scripts/render_runtime_parity.py"
      - ".github/workflows/live-public-agent-e2e.yml"
  pull_request:
    paths:
      - "scripts/live_public_agent_e2e.py"
      - "scripts/check_public_e2e_runtime.py"
      - "scripts/github_api_auth.py"
      - "scripts/e2e_health_state.py"
      - "scripts/render_runtime_parity.py"
      - "tests/test_render_runtime_parity.py"
      - "tests/test_e2e_health_state.py"
      - "tests/test_github_api_auth.py"
      - "tests/test_public_e2e_runtime_preflight.py"
      - ".github/workflows/live-public-agent-e2e.yml"

permissions:
  contents: read

concurrency:
  group: live-public-agent-e2e
  # Queue revisions until the current disposable analysis has finished, so a
  # newly fixed harness does not cancel a live GPU/CPU inference mid-run.
  cancel-in-progress: false

jobs:
  # PRs validate the harness offline; public upload is reserved for main.
  validate-harness:
    if: github.event_name == 'pull_request'
    name: Validate E2E harness without public upload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML parser for parity tests
        run: python -m pip install pyyaml
      - name: Compile public E2E and runtime preflight harnesses
        run: python -m py_compile scripts/live_public_agent_e2e.py scripts/check_public_e2e_runtime.py scripts/github_api_auth.py scripts/e2e_health_state.py scripts/render_runtime_parity.py tests/test_render_runtime_parity.py
      - name: Test Docker-aware Render runtime classification
        run: python -m unittest discover -s tests -p 'test_render_runtime_parity.py' -v

  public-upload-to-agent:
    if: github.ref == 'refs/heads/main'
    name: Public upload → real inference → verified specialists → UI/reports
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact tested revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify deployed runtime before browser dependency installation
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          BIONUCLEI_PUBLIC_API_URL: https://bionuclei-community-analyzer.onrender.com
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_public_e2e_runtime.py
      - name: Install browser E2E dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy tifffile requests playwright "pypdf>=5.0"
          python -m playwright install --with-deps chromium
      - name: Validate test syntax
        run: python -m py_compile scripts/live_public_agent_e2e.py
      - name: Exercise public upload and real scientific pipeline
        env:
          BIONUCLEI_PUBLIC_SITE_URL: https://burhanabdullah.github.io/BioNuclei-DomainRobust/bionuclei-app.html
          BIONUCLEI_PUBLIC_API_URL: https://bionuclei-community-analyzer.onrender.com
          BIONUCLEI_ANALYSIS_TIMEOUT_MS: "1200000"
          BIONUCLEI_JOB_STALL_TIMEOUT_SECONDS: "240"
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/live_public_agent_e2e.py
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-public-agent-e2e-failure-${{ github.run_id }}
          path: |
            live-agent-e2e-failure.png
            live-agent-e2e-failure.json
          if-no-files-found: ignore
          retention-days: 7
