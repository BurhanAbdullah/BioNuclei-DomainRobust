name: Public E2E schedule watchdog

on:
  pull_request:
    paths:
      - ".github/workflows/public-e2e-schedule-watchdog.yml"
      - "scripts/public_e2e_schedule_watchdog.py"
      - "tests/test_public_e2e_schedule_watchdog.py"
      - ".github/workflows/live-public-agent-e2e.yml"
      - "tests/test_render_runtime_parity.py"

permissions:
  contents: read
concurrency:
  group: public-e2e-schedule-watchdog
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test watchdog decisions
        run: python -m unittest discover -s tests -p 'test_public_e2e_schedule_watchdog.py' -v
      - name: Compile watchdog
        run: python -m py_compile scripts/public_e2e_schedule_watchdog.py
      - name: Validate workflow YAML syntax
        run: ruby -e 'require "yaml"; YAML.parse_file(ARGV.fetch(0)); YAML.parse_file(ARGV.fetch(1)); puts "YAML syntax OK"' .github/workflows/public-e2e-schedule-watchdog.yml .github/workflows/live-public-agent-e2e.yml
