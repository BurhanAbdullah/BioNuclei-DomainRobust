name: S-BIAD634 zero-shot transfer

# Consume only a successful BBBC039 baseline from the exact current main SHA.
# PR/fork/stale-main checkpoints are deliberately rejected.
on:
  workflow_run:
    workflows: ["BBBC039 baseline experiment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: 'Completed BBBC039 baseline run on the exact current main SHA (optional)'
        required: false

jobs:
  zero-shot:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy scikit-image tifffile imagecodecs pyyaml
          python -m pip install -e . --no-deps
      - name: Select and verify exact-main baseline run
        id: run
        env:
          MANUAL_RUN_ID: ${{ inputs.baseline_run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/main" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          CHECKOUT_SHA=$(git rev-parse HEAD)
          if [ -n "$MANUAL_RUN_ID" ]; then
            RUN_ID="$MANUAL_RUN_ID"
          elif [ -n "$EVENT_RUN_ID" ]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/bbbc039_baseline.yml/runs?branch=main&per_page=100" \
              | python -c 'import json,sys,os; d=json.load(sys.stdin); sha=os.environ["CURRENT_MAIN_SHA"]; print(next((str(r["id"]) for r in d["workflow_runs"] if r.get("head_branch")=="main" and r.get("conclusion")=="success" and r.get("head_sha")==sha), ""))')
          fi
          test -n "$RUN_ID"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID" \
            > "$RUNNER_TEMP/baseline-run.json"
          python - "$RUNNER_TEMP/baseline-run.json" "$CURRENT_MAIN_SHA" "$CHECKOUT_SHA" "$EVENT_RUN_SHA" "$EVENT_RUN_BRANCH" <<'PY'
          import json, sys
          run=json.loads(open(sys.argv[1], encoding="utf-8").read())
          current_main_sha, checkout_sha, event_sha, event_branch=sys.argv[2:]
          expected_path=".github/workflows/bbbc039_baseline.yml"
          checks={
              "baseline branch is main": run.get("head_branch")=="main",
              "baseline conclusion is success": run.get("conclusion")=="success",
              "baseline workflow path is exact": run.get("path")==expected_path,
              "baseline SHA equals current main": run.get("head_sha")==current_main_sha,
              "evaluation checkout equals current main": checkout_sha==current_main_sha,
              "workflow_run event SHA matches baseline": not event_sha or run.get("head_sha")==event_sha,
              "workflow_run event branch is main": not event_branch or event_branch=="main",
          }
          for name,ok in checks.items():
              print(f"{name}: {'PASS' if ok else 'FAIL'}")
          if not all(checks.values()):
              raise SystemExit("Refusing to evaluate a non-main or stale baseline checkpoint")
          print(f"Verified exact-main baseline run {run['id']} at {current_main_sha}")
          PY
          BASELINE_SHA=$(python - "$RUNNER_TEMP/baseline-run.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["head_sha"])
          PY
          )
          BASELINE_BRANCH=$(python - "$RUNNER_TEMP/baseline-run.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["head_branch"])
          PY
          )
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "baseline_sha=$BASELINE_SHA" >> "$GITHUB_OUTPUT"
          echo "baseline_branch=$BASELINE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Using exact-main baseline run $RUN_ID at $BASELINE_SHA"
      - name: Download baseline artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.run.outputs.run_id }}
          name: bbbc039-baseline-${{ steps.run.outputs.run_id }}
          path: baseline_artifact
      - name: Locate checkpoint
        run: |
          set -euo pipefail
          test -f baseline_artifact/outputs/bbbc039_baseline/last.pt
          cp baseline_artifact/outputs/bbbc039_baseline/last.pt baseline_artifact/last.pt
      - name: Verify baseline checkpoint training recipe
        run: |
          python scripts/verify_bbbc039_checkpoint.py \
            --checkpoint baseline_artifact/last.pt \
            --config configs/bbbc039_baseline.yaml
      - name: Record evaluation provenance
        run: |
          set -euo pipefail
          mkdir -p outputs/s_biad634_zero_shot
          export CHECKPOINT_SHA256=$(sha256sum baseline_artifact/last.pt | awk '{print $1}')
          export EVALUATION_SHA=$(git rev-parse HEAD)
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = {
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'evaluation_commit': os.environ.get('EVALUATION_SHA'),
              'baseline_run_id': os.environ.get('BASELINE_RUN_ID'),
              'baseline_run_sha': os.environ.get('BASELINE_RUN_SHA'),
              'baseline_branch': os.environ.get('BASELINE_BRANCH'),
              'checkpoint_sha256': os.environ.get('CHECKPOINT_SHA256'),
          }
          Path('outputs/s_biad634_zero_shot/provenance.json').write_text(json.dumps(out, indent=2) + '\n')
          PY
        env:
          BASELINE_RUN_ID: ${{ steps.run.outputs.run_id }}
          BASELINE_RUN_SHA: ${{ steps.run.outputs.baseline_sha }}
          BASELINE_BRANCH: ${{ steps.run.outputs.baseline_branch }}
      - name: Download and inventory S-BIAD634
        run: python scripts/download_s_biad634.py --data-root data/raw/S-BIAD634
      - name: Run zero-shot transfer evaluation
        run: |
          PYTHONPATH="$PWD" python scripts/evaluate_s_biad634.py \
            --checkpoint baseline_artifact/last.pt \
            --data-root data/raw/S-BIAD634 \
            --output outputs/s_biad634_zero_shot
      - name: Require complete zero-shot metrics
        run: |
          test -s outputs/s_biad634_zero_shot/metrics.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/s_biad634_zero_shot/metrics.json')
          d = json.loads(p.read_text())
          assert d.get('n_images') == 79, d.get('n_images')
          assert len(d.get('per_image', [])) == 79
          for key in ('dice', 'iou', 'precision', 'recall', 'f1_score', 'aji', 'boundary_f1'):
              assert key in d.get('mean', {}) and key in d.get('median', {}), key
          assert d.get('instance_iou_threshold') == 0.5
          print('Verified 79-image zero-shot metrics artifact including instance precision/recall/F1.')
          PY
      - name: Bind target dataset and metrics to provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          manifest_path = Path("data/raw/S-BIAD634/download_manifest.json")
          metrics_path = Path("outputs/s_biad634_zero_shot/metrics.json")
          provenance_path = Path("outputs/s_biad634_zero_shot/provenance.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          metrics = json.loads(metrics_path.read_text(encoding="utf-8"))
          provenance = json.loads(provenance_path.read_text(encoding="utf-8"))
          dataset = manifest.get("dataset")
          archive_sha256 = manifest.get("archive_sha256")
          files = manifest.get("files")
          if not isinstance(dataset, str) or "S-BIAD634" not in dataset:
              raise SystemExit("Target download manifest does not identify S-BIAD634")
          if not isinstance(archive_sha256, str) or not re.fullmatch(r"[0-9a-f]{64}", archive_sha256):
              raise SystemExit("Target download manifest has no valid archive SHA-256")
          if not isinstance(files, list) or not files:
              raise SystemExit("Target download manifest has no file inventory")
          if metrics.get("n_images") != 79 or len(metrics.get("per_image", [])) != 79:
              raise SystemExit("Refusing to bind incomplete S-BIAD634 metrics")
          if metrics.get("instance_iou_threshold") != 0.5:
              raise SystemExit("Unexpected instance IoU matching threshold")
          provenance.update({
              "target_dataset": dataset,
              "target_manifest_sha256": sha256(manifest_path),
              "target_archive_sha256": archive_sha256,
              "target_manifest_file_count": len(files),
              "metrics_sha256": sha256(metrics_path),
              "evaluator_sha256": sha256(Path("scripts/evaluate_s_biad634.py")),
              "instance_metrics_sha256": sha256(Path("scripts/metrics_instance.py")),
              "target_data_used_for_training": False,
              "n_target_images": metrics["n_images"],
              "instance_iou_threshold": metrics["instance_iou_threshold"],
          })
          provenance_path.write_text(json.dumps(provenance, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "target_dataset": dataset,
              "target_manifest_sha256": provenance["target_manifest_sha256"],
              "target_archive_sha256": archive_sha256,
              "metrics_sha256": provenance["metrics_sha256"],
              "evaluator_sha256": provenance["evaluator_sha256"],
              "target_data_used_for_training": False,
              "n_target_images": metrics["n_images"],
          }, sort_keys=True))
          PY
      - name: Upload zero-shot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-biad634-zero-shot-${{ github.run_id }}
          path: |
            outputs/s_biad634_zero_shot/
            data/raw/S-BIAD634/download_manifest.json
          retention-days: 30
