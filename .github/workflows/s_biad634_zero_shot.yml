name: S-BIAD634 zero-shot transfer

# Release-gate rerun: execute after evaluator/data-pairing fixes.
# Records exact repository/checkpoint provenance and requires a complete 79-image artifact.
# Manual release-gate trigger requested 2026-08-18 after P/R/F1 integration.

on:
  push:
    paths:
      - 'scripts/evaluate_s_biad634.py'
      - 'scripts/metrics_instance.py'
      - 'scripts/download_s_biad634.py'
      - '.github/workflows/s_biad634_zero_shot.yml'
  workflow_run:
    workflows: ["BBBC039 baseline experiment"]
    types: [completed]
  workflow_dispatch:
    inputs:
      baseline_run_id:
        description: 'Completed BBBC039 baseline workflow run ID (optional; latest successful run is used when omitted)'
        required: false

jobs:
  zero-shot:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy scikit-image tifffile imagecodecs pyyaml
          python -m pip install -e . --no-deps
      - name: Select baseline run
        id: run
        env:
          MANUAL_RUN_ID: ${{ inputs.baseline_run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$MANUAL_RUN_ID" ]; then
            RUN_ID="$MANUAL_RUN_ID"
          elif [ -n "$EVENT_RUN_ID" ]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/bbbc039_baseline.yml/runs?status=success&per_page=20" \
              | python -c 'import json,sys; d=json.load(sys.stdin); print(next((r["id"] for r in d["workflow_runs"] if r["conclusion"]=="success"), ""))')
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using baseline run $RUN_ID"
      - name: Download baseline artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.run.outputs.run_id }}
          name: bbbc039-baseline-${{ steps.run.outputs.run_id }}
          path: baseline_artifact
      - name: Locate checkpoint
        run: |
          test -f baseline_artifact/outputs/bbbc039_baseline/last.pt
          cp baseline_artifact/outputs/bbbc039_baseline/last.pt baseline_artifact/last.pt
      - name: Record evaluation provenance
        run: |
          mkdir -p outputs/s_biad634_zero_shot
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = {
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'commit': os.environ.get('GITHUB_SHA'),
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'baseline_run_id': os.environ.get('BASELINE_RUN_ID'),
          }
          Path('outputs/s_biad634_zero_shot/provenance.json').write_text(json.dumps(out, indent=2) + '\n')
          PY
        env:
          BASELINE_RUN_ID: ${{ steps.run.outputs.run_id }}
      - name: Download and inventory S-BIAD634
        run: python scripts/download_s_biad634.py --data-root data/raw/S-BIAD634
      - name: Run zero-shot transfer evaluation
        run: |
          PYTHONPATH="$PWD" python scripts/evaluate_s_biad634.py \
            --checkpoint baseline_artifact/last.pt \
            --data-root data/raw/S-BIAD634 \
            --output outputs/s_biad634_zero_shot
      - name: Require complete zero-shot metrics
        run: |
          test -s outputs/s_biad634_zero_shot/metrics.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('outputs/s_biad634_zero_shot/metrics.json')
          d = json.loads(p.read_text())
          assert d.get('n_images') == 79, d.get('n_images')
          assert len(d.get('per_image', [])) == 79
          for key in ('dice', 'iou', 'precision', 'recall', 'f1_score', 'aji', 'boundary_f1'):
              assert key in d.get('mean', {}) and key in d.get('median', {}), key
          assert d.get('instance_iou_threshold') == 0.5
          print('Verified 79-image zero-shot metrics artifact including instance precision/recall/F1.')
          PY
      - name: Upload zero-shot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s-biad634-zero-shot-${{ github.run_id }}
          path: |
            outputs/s_biad634_zero_shot/
            data/raw/S-BIAD634/download_manifest.json
          retention-days: 30
