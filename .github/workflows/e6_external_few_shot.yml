name: E6 external fluorescence few-shot adaptation

# E6 is fail-closed: all four preregistered fractions must independently
# execute and produce provenance-verified evidence before aggregation.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/e6_external_few_shot.yml"
      - "scripts/e6_run_external_few_shot.py"
      - "scripts/download_aitslab_bioimaging1.py"
      - "scripts/train_domain_robust.py"
      - "scripts/evaluate_instance_manifest.py"
      - "src/bionuclei/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      e4_artifact_id:
        description: "Retained E4 artifact ID containing the frozen checkpoint"
        required: true
        default: "9912441468"
      expected_e4_digest:
        description: "Expected SHA-256 digest of the retained E4 artifact"
        required: true
        default: "sha256:7e6efb89b11d6d04db2eb5da257cd33cb19d93e5223c8e6c93c638308c3e9afa"

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  NUMEXPR_NUM_THREADS: "2"
  BIONUCLEI_NUM_WORKERS: "0"

jobs:
  e6_fraction:
    name: E6 ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Serialize the four identical-protocol training jobs. This changes only
      # scheduling and prevents the 25% job from competing for hosted resources.
      max-parallel: 1
      matrix:
        include:
          - label: 01pct
            fraction: 0.01
          - label: 05pct
            fraction: 0.05
          - label: 10pct
            fraction: 0.10
          - label: 25pct
            fraction: 0.25
    env:
      E4_ARTIFACT_ID: ${{ inputs.e4_artifact_id || '9912441468' }}
      EXPECTED_E4_DIGEST: ${{ inputs.expected_e4_digest || 'sha256:7e6efb89b11d6d04db2eb5da257cd33cb19d93e5223c8e6c93c638308c3e9afa' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Install package runtime dependencies
        run: |
          python -m pip install -e . --no-deps
          python -m pip install \
            "numpy>=1.24" \
            "scipy>=1.10" \
            "pandas>=2.0" \
            "scikit-image>=0.21" \
            "scikit-learn>=1.3" \
            "tifffile>=2023.7.10" \
            "pyyaml>=6.0" \
            "tqdm>=4.66"
      - name: Verify runtime device and dependencies
        run: |
          python - <<'PY'
          import pandas, scipy, sklearn, skimage, tifffile, torch, yaml
          print({
              'torch': torch.__version__,
              'cuda_available': torch.cuda.is_available(),
              'pandas': pandas.__version__,
              'scipy': scipy.__version__,
              'sklearn': sklearn.__version__,
              'skimage': skimage.__version__,
              'tifffile': tifffile.__version__,
              'yaml': yaml.__version__,
          })
          assert not torch.cuda.is_available(), 'Unexpected CUDA runtime on CPU validation runner'
          PY
      - name: Provision temporary swap for 25% only
        if: ${{ matrix.label == '25pct' }}
        run: |
          set -euo pipefail
          if ! swapon --show | grep -q '/swapfile'; then
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          swapon --show
          free -h
      - name: Start 25% memory and process diagnostics
        if: ${{ matrix.label == '25pct' }}
        run: |
          set -euo pipefail
          (
            while true; do
              printf '\n=== %s ===\n' "$(date -Is)"
              free -h
              awk '/MemAvailable|SwapFree|SwapTotal/ {print}' /proc/meminfo
              ps -eo pid,ppid,rss,vsz,stat,etime,cmd --sort=-rss | head -n 12
              sleep 2
            done
          ) > e6_25pct_memory_watch.log 2>&1 &
          echo $! > e6_25pct_memory_watch.pid
      - name: Verify retained E4 artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${E4_ARTIFACT_ID}" --jq '.digest')"
          test "${digest}" = "${EXPECTED_E4_DIGEST}"
      - name: Download frozen E4 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${E4_ARTIFACT_ID}/zip" > e4.zip
          unzip -q e4.zip -d e4_artifact
          test -f e4_artifact/outputs/e4_domain_robust/last.pt
          python - <<'PY'
          import torch, yaml
          ckpt=torch.load('e4_artifact/outputs/e4_domain_robust/last.pt', map_location='cpu')
          assert 'config' in ckpt and 'model' in ckpt
          yaml.safe_dump(ckpt['config'], open('e4_config.yaml','w'), sort_keys=False)
          PY
      - name: Acquire authoritative Aitslab-bioimaging1
        run: python scripts/download_aitslab_bioimaging1.py --output data/raw/Aitslab_bioimaging1
      - name: Verify publisher split counts and leakage guard
        run: |
          python - <<'PY'
          import json
          m=json.load(open('data/raw/Aitslab_bioimaging1/manifest.json'))
          counts={k:len(v) for k,v in m['partitions'].items()}
          assert counts == {'train':30,'development':10,'test':10}, counts
          ids={k:{r['image_id'] for r in v} for k,v in m['partitions'].items()}
          assert not (ids['train'] & ids['development'])
          assert not (ids['train'] & ids['test'])
          assert not (ids['development'] & ids['test'])
          for split, rows in m['partitions'].items():
              assert len({r['image_id'] for r in rows}) == len(rows), split
          assert all(v.get('sha256') for v in m['archives'].values())
          PY
      - name: Run this preregistered E6 fraction
        run: |
          python scripts/e6_run_external_few_shot.py \
            --config e4_config.yaml \
            --dataset-root data/raw/Aitslab_bioimaging1 \
            --dataset-manifest data/raw/Aitslab_bioimaging1/manifest.json \
            --init-checkpoint e4_artifact/outputs/e4_domain_robust/last.pt \
            --output outputs/e6_external_few_shot/${{ matrix.label }} \
            --epochs 20 \
            --seed 42 \
            --fraction ${{ matrix.fraction }}
      - name: Stop diagnostics and capture runner state
        if: ${{ always() && matrix.label == '25pct' }}
        run: |
          set +e
          test -f e6_25pct_memory_watch.pid && kill "$(cat e6_25pct_memory_watch.pid)" || true
          echo '=== memory watcher tail ==='
          tail -n 100 e6_25pct_memory_watch.log 2>/dev/null || true
          echo '=== disk ==='
          df -h || true
          echo '=== processes ==='
          ps -ef || true
          echo '=== kernel OOM diagnostics ==='
          sudo dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -n 50 || true
      - name: Cross-check this fraction
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('outputs/e6_external_few_shot')
          label='${{ matrix.label }}'
          candidates=[root/label, root/label/label, root]
          run=next((p for p in candidates if (p/'provenance.json').is_file()), None)
          assert run is not None, candidates
          expected={'01pct':(0.01,1),'05pct':(0.05,2),'10pct':(0.10,3),'25pct':(0.25,8)}[label]
          prov=json.loads((run/'provenance.json').read_text())
          assert (prov['fraction'],prov['n_adaptation_images']) == expected
          assert (prov['seed'],prov['epochs']) == (42,20)
          assert prov['s_biad634_used_for_adaptation'] is False
          assert prov['test_images_used_for_adaptation'] is False
          assert prov['development_images_used_for_training_or_selection'] is False
          metrics=json.loads((run/'evaluation'/'test_metrics.json').read_text())
          assert metrics['n_images'] == 10
          assert all(k in metrics['mean'] for k in ('dice','iou','aji','boundary_f1'))
          digest=hashlib.sha256((run/'evaluation'/'test_metrics.json').read_bytes()).hexdigest()
          assert digest == prov['test_metrics_sha256']
          assert prov['dataset_archive_sha256']
          assert prov['train_command'] and prov['evaluation_command']
          print(f'{label}: PASS')
          PY
      - name: Upload fraction evidence and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e6-fraction-${{ matrix.label }}-${{ github.run_id }}
          path: |
            outputs/e6_external_few_shot/${{ matrix.label }}/**
            data/raw/Aitslab_bioimaging1/manifest.json
            e6_25pct_memory_watch.log
          if-no-files-found: ignore
          retention-days: 30

  e6_aggregate:
    name: E6 aggregate evidence
    needs: e6_fraction
    if: ${{ always() && needs.e6_fraction.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download fraction evidence
        uses: actions/download-artifact@v4
        with:
          pattern: e6-fraction-*-${{ github.run_id }}
          path: outputs/e6_fraction_evidence
          merge-multiple: true
      - name: Aggregate and cross-check E6 evidence
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('outputs/e6_fraction_evidence')
          expected=[('01pct',0.01,1),('05pct',0.05,2),('10pct',0.10,3),('25pct',0.25,8)]
          rows=[]
          for label,frac,n in expected:
              candidates=[root/label, root/label/label, root]
              run=next((p for p in candidates if (p/'provenance.json').is_file() and json.loads((p/'provenance.json').read_text()).get('fraction')==frac), None)
              assert run is not None, f'missing {label}'
              prov=json.loads((run/'provenance.json').read_text())
              metrics=json.loads((run/'evaluation'/'test_metrics.json').read_text())
              assert prov['fraction'] == frac
              assert prov['n_adaptation_images'] == n
              assert (prov['seed'],prov['epochs']) == (42,20)
              assert metrics['n_images'] == 10
              assert all(k in metrics['mean'] for k in ('dice','iou','aji','boundary_f1'))
              assert prov['s_biad634_used_for_adaptation'] is False
              assert prov['test_images_used_for_adaptation'] is False
              assert prov['development_images_used_for_training_or_selection'] is False
              digest=hashlib.sha256((run/'evaluation'/'test_metrics.json').read_bytes()).hexdigest()
              assert digest == prov['test_metrics_sha256']
              rows.append({'label':label,'fraction':frac,'n_adaptation_images':n,'mean':metrics['mean'],'metrics_sha256':digest,'provenance_sha256':hashlib.sha256((run/'provenance.json').read_bytes()).hexdigest()})
          out=pathlib.Path('outputs/e6_external_few_shot_final'); out.mkdir(parents=True,exist_ok=True)
          (out/'aggregate_results.json').write_text(json.dumps({'protocol':'E6_cross_dataset_few_shot','fractions':rows,'all_four_fractions_verified':True},indent=2)+'\n')
          print('E6 aggregate evidence cross-check: PASS')
          PY
      - name: Upload final E6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: e6-external-few-shot-${{ github.run_id }}
          path: outputs/e6_external_few_shot_final/**
          if-no-files-found: error
          retention-days: 30
