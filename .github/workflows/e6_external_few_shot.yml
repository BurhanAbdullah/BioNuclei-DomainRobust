name: E6 external fluorescence few-shot adaptation

on:
  workflow_dispatch:
    inputs:
      e4_artifact_id:
        description: "Retained E4 artifact ID containing the frozen checkpoint"
        required: true
        default: "9912441468"
      expected_e4_digest:
        description: "Expected SHA-256 digest of the retained E4 artifact"
        required: true
        default: "sha256:7e6efb89b11d6d04db2eb5da257cd33cb19d93e5223c8e6c93c638308c3e9afa"

permissions:
  contents: read
  actions: read

jobs:
  e6:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Verify retained E4 artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.e4_artifact_id }}
          EXPECTED_DIGEST: ${{ inputs.expected_e4_digest }}
        run: |
          set -euo pipefail
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq '.digest')"
          test "${digest}" = "${EXPECTED_DIGEST}"

      - name: Download frozen E4 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.e4_artifact_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > e4.zip
          unzip -q e4.zip -d e4_artifact
          test -f e4_artifact/outputs/e4_domain_robust/last.pt
          python - <<'PY'
          import torch, yaml
          ckpt=torch.load('e4_artifact/outputs/e4_domain_robust/last.pt', map_location='cpu')
          yaml.safe_dump(ckpt['config'], open('e4_config.yaml','w'), sort_keys=False)
          PY

      - name: Acquire authoritative Aitslab-bioimaging1
        run: python scripts/download_aitslab_bioimaging1.py --output data/raw/Aitslab_bioimaging1

      - name: Verify publisher split counts
        run: |
          python - <<'PY'
          import json
          m=json.load(open('data/raw/Aitslab_bioimaging1/manifest.json'))
          counts={k:len(v) for k,v in m['partitions'].items()}
          print(counts)
          assert counts == {'train':30,'development':10,'test':10}, counts
          PY

      - name: Run all preregistered E6 fractions
        run: |
          python scripts/e6_run_external_few_shot.py \
            --config e4_config.yaml \
            --dataset-root data/raw/Aitslab_bioimaging1 \
            --dataset-manifest data/raw/Aitslab_bioimaging1/manifest.json \
            --init-checkpoint e4_artifact/outputs/e4_domain_robust/last.pt \
            --output outputs/e6_external_few_shot \
            --epochs 20 \
            --seed 42

      - name: Cross-check E6 machine-readable evidence
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('outputs/e6_external_few_shot')
          r=json.loads((p/'aggregate_results.json').read_text())
          assert [x['fraction'] for x in r['fractions']] == [0.01,0.05,0.10,0.25]
          assert all(x['n_adaptation_images'] in (1,2,3,8) for x in r['fractions'])
          assert all(all(k in x['mean'] for k in ('dice','iou','aji','boundary_f1')) for x in r['fractions'])
          print('E6 artifact cross-check: PASS')
          PY

      - name: Upload E6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: e6-external-few-shot-${{ github.run_id }}
          path: |
            outputs/e6_external_few_shot/**
            data/raw/Aitslab_bioimaging1/manifest.json
          if-no-files-found: error
          retention-days: 30
