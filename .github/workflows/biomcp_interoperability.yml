name: BioMCP interoperability

on:
  pull_request:
    paths:
      - "src/bionuclei/mcp_server.py"
      - "src/bionuclei/data.py"
      - "src/bionuclei/masks.py"
      - "src/bionuclei/metrics.py"
      - "pyproject.toml"
      - "scripts/biomcp_interop_smoke.py"
      - ".github/workflows/biomcp_interoperability.yml"
  push:
    branches: [main]
    paths:
      - "src/bionuclei/mcp_server.py"
      - "src/bionuclei/data.py"
      - "src/bionuclei/masks.py"
      - "src/bionuclei/metrics.py"
      - "pyproject.toml"
      - "scripts/biomcp_interop_smoke.py"
      - ".github/workflows/biomcp_interoperability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-biomcp-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install BioNuclei MCP server
        run: python -m pip install -e ".[mcp]"
      - name: Install pinned public BioMCP client with external-stdio support
        run: python -m pip install "git+https://github.com/BurhanAbdullah/BioMCP.git@8914fdbbbc89bd88e9b7d080edce464d1a7b7cfa"
      - name: Run real BioMCP-to-BioNuclei scientific tool calls
        run: python scripts/biomcp_interop_smoke.py
