name: BioMCP and web validation

on:
  push:
    branches: [main]
    paths:
      - "src/bionuclei/mcp_server.py"
      - "webapp/**"
      - "tests/test_mcp_server.py"
      - "pyproject.toml"
      - "docs/use.html"
      - ".github/workflows/biomcp_web_validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp:
    name: MCP server smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package with MCP extra
        run: python -m pip install -e ".[mcp,test]"
      - name: Validate module and MCP registry
        run: |
          python - <<'PY'
          from bionuclei.mcp_server import build_server
          server = build_server()
          assert server.name == "BioMCP-BioNuclei"
          print("BioMCP server construction: PASS")
          PY
      - name: Run MCP-focused tests
        run: pytest -q tests/test_mcp_server.py

  web:
    name: Web adapter smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install web extra
        run: python -m pip install -e ".[web,test]"
      - name: Import web application
        run: |
          python - <<'PY'
          from webapp.app import app
          routes = {route.path for route in app.routes}
          required = {"/health", "/tools", "/inspect", "/predict", "/evaluate", "/metrics", "/provenance"}
          missing = required - routes
          assert not missing, missing
          print("BioMCP Web API routes: PASS")
          PY
      - name: Run full tests
        run: pytest -q

  website:
    name: Public console integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate public console redirect
        run: |
          set -euo pipefail
          # docs/use.html intentionally retires the old developer console and
          # redirects users to the maintained BioNuclei Lab. MCP tools are
          # tested against the actual registry/server in the MCP jobs above.
          test -s docs/use.html
          grep -q 'http-equiv="refresh"' docs/use.html
          grep -q 'url=bionuclei-lab.html' docs/use.html
          grep -q 'old developer console has been retired' docs/use.html
          grep -q 'href="bionuclei-lab.html"' docs/use.html
          test -s docs/bionuclei-lab.html
          echo "Public BioMCP console redirect: PASS"
