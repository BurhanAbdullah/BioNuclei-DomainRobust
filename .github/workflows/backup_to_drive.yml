# Daily encrypted backup of BioNuclei user data into the administrator's Google Drive folder.
name: Backup to Google Drive

on:
  schedule:
    - cron: "17 21 * * *"   # 02:47 IST daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drive-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: python -m pip install --quiet "cryptography>=43"
      - name: Pull, verify and upload
        env:
          BIONUCLEI_SERVER_URL: ${{ vars.BIONUCLEI_SERVER_URL || 'https://bionuclei-community-analyzer.onrender.com' }}
          BIONUCLEI_BACKUP_TOKEN: ${{ secrets.BIONUCLEI_BACKUP_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID || '1IUcF1OuF0beo1e1sLgDOHKyOOF9n8wAY' }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_KEEP: "30"
        run: |
          set +e
          python scripts/drive_backup.py
          code=$?
          if [ "$code" = "3" ]; then
            echo "::warning::Drive backup is not configured yet. Add the secrets listed in docs/STORAGE_AND_BACKUP.md."
            echo "Drive backup not configured: secrets missing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $code
