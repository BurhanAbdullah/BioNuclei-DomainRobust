name: E6 finalize verified evidence

# Aggregate only the four successful fraction artifacts from the completed E6
# source run. This intentionally avoids any long-lived artifact IDs.
on:
  workflow_run:
    workflows: ["E6 external fluorescence few-shot adaptation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Optional successful E6 source run ID (defaults to latest successful main run)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  E4_ARTIFACT_ID: "12183110279"
  EXPECTED_E4_DIGEST: "sha256:89e66617e272d30ec46471c8403950c404c772780ad778dd6f0e992fc795df0d"

jobs:
  finalize:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: E6 verified aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve successful E6 source run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          source_run_id="${EVENT_RUN_ID:-${INPUT_RUN_ID:-}}"
          if [ -z "$source_run_id" ]; then
            source_run_id="$(gh run list --workflow e6_external_few_shot.yml --branch main --status success --json databaseId --limit 1 --jq '.[0].databaseId')"
          fi
          test -n "$source_run_id" && test "$source_run_id" != "null"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}" > source-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('source-run.json').read_text())
          assert run['conclusion']=='success', run
          assert run['head_branch']=='main', run
          print({'source_run_id':run['id'],'source_commit':run['head_sha'],'conclusion':run['conclusion']})
          Path('source_run_id.txt').write_text(str(run['id']))
          Path('source_commit.txt').write_text(run['head_sha'])
          PY
          echo "E6_SOURCE_RUN_ID=$source_run_id" >> "$GITHUB_ENV"

      - name: Verify frozen E4 checkpoint identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${E4_ARTIFACT_ID}")"
          test "$(jq -r '.expired' <<<"$meta")" = "false"
          test "$(jq -r '.digest' <<<"$meta")" = "$EXPECTED_E4_DIGEST"
          echo "E4 artifact verified: ${E4_ARTIFACT_ID} / ${EXPECTED_E4_DIGEST}"

      - name: Download the four exact artifacts from this E6 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run_id="$(cat source_run_id.txt)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/artifacts?per_page=100" > source-artifacts.json
          mkdir -p fractions
          for label in 01pct 05pct 10pct 25pct; do
            name="e6-fraction-${label}-${source_run_id}"
            artifact_id="$(jq -r --arg n "$name" '[.artifacts[] | select(.name == $n and .expired == false)] | sort_by(.created_at) | if length == 0 then empty else last.id end' source-artifacts.json)"
            test -n "$artifact_id" || { echo "Missing live artifact $name in source run $source_run_id"; exit 1; }
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "fractions/${label}.zip"
            unzip -q "fractions/${label}.zip" -d "fractions/${label}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > "fractions/${label}/artifact-metadata.json"
          done

      - name: Validate and aggregate the frozen E6 evidence
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('fractions')
          expected = [('01pct', 0.01, 1), ('05pct', 0.05, 2), ('10pct', 0.10, 3), ('25pct', 0.25, 8)]
          rows = []
          common = None
          source_metadata = {}
          for label, frac, n in expected:
              artifact_meta = json.loads(root.joinpath(label, 'artifact-metadata.json').read_text())
              assert artifact_meta['expired'] is False
              source_metadata[label] = {
                  'artifact_id': artifact_meta['id'],
                  'name': artifact_meta['name'],
                  'digest': artifact_meta['digest'],
                  'run_id': artifact_meta['workflow_run']['id'],
                  'source_commit': artifact_meta['workflow_run']['head_sha'],
              }
              matches = list(root.joinpath(label).rglob('provenance.json'))
              assert len(matches) == 1, (label, matches)
              prov_path = matches[0]
              prov = json.loads(prov_path.read_text())
              metrics_path = prov_path.parent / 'evaluation' / 'test_metrics.json'
              assert metrics_path.is_file(), metrics_path
              metrics = json.loads(metrics_path.read_text())
              assert (float(prov['fraction']), int(prov['n_adaptation_images'])) == (frac, n), label
              assert (int(prov['seed']), int(prov['epochs'])) == (42, 20), label
              assert prov['s_biad634_used_for_adaptation'] is False, label
              assert prov['test_images_used_for_adaptation'] is False, label
              assert prov['development_images_used_for_training_or_selection'] is False, label
              assert prov.get('activation_checkpointing') is True, label
              assert metrics['n_images'] == 10, label
              assert all(k in metrics['mean'] for k in ('dice', 'iou', 'aji', 'boundary_f1')), label
              metric_sha = hashlib.sha256(metrics_path.read_bytes()).hexdigest()
              assert metric_sha == prov['test_metrics_sha256'], label
              immutable = {
                  'dataset_manifest_sha256': prov['dataset_manifest_sha256'],
                  'dataset_archive_sha256': prov['dataset_archive_sha256'],
                  'config_sha256': prov['config_sha256'],
                  'init_checkpoint_sha256': prov['init_checkpoint_sha256'],
              }
              if common is None:
                  common = immutable
              else:
                  assert immutable == common, f'{label}: immutable provenance mismatch'
              rows.append({
                  'label': label,
                  'fraction': frac,
                  'n_adaptation_images': n,
                  'mean': metrics['mean'],
                  'test_metrics_sha256': metric_sha,
                  'provenance_sha256': hashlib.sha256(prov_path.read_bytes()).hexdigest(),
                  'activation_checkpointing': prov.get('activation_checkpointing'),
              })

          source_run = json.loads(Path('source-run.json').read_text())
          e4_meta = json.loads(Path('fractions/01pct/artifact-metadata.json').read_text())
          aggregate = {
              'protocol': 'E6_cross_dataset_few_shot',
              'source_run_id': int(Path('source_run_id.txt').read_text()),
              'source_commit': Path('source_commit.txt').read_text(),
              'all_four_fractions_verified': True,
              'immutable_provenance_common': common,
              'e4_checkpoint_artifact_id': int(__import__('os').environ['E4_ARTIFACT_ID']),
              'e4_checkpoint_artifact_digest': __import__('os').environ['EXPECTED_E4_DIGEST'],
              'fraction_artifacts': source_metadata,
              'fractions': rows,
              'acceptance_note': 'Four fraction artifacts came from one successful E6 run. Each fraction is provenance-verified with seed 42, 20 epochs, activation checkpointing, consistent immutable dataset/config/checkpoint hashes, and explicit leakage guards.',
          }
          out = Path('e6_verified')
          out.mkdir(exist_ok=True)
          (out / 'aggregate_results.json').write_text(json.dumps(aggregate, indent=2) + chr(10))
          print('E6 verified aggregate: PASS')
          for row in rows:
              print(row['label'], row['mean'])
          PY

      - name: Upload finalized E6 evidence
        uses: actions/upload-artifact@v4
        with:
          name: e6-external-few-shot-final-${{ github.run_id }}
          path: e6_verified/**
          if-no-files-found: error
          retention-days: 90
