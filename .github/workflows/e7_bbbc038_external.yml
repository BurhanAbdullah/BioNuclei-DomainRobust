name: E7 BBBC038 external validation

# E7 is independent of E6 and uses only the retained frozen E4 checkpoint.
# The workflow_run trigger ensures the independent validation executes after the
# repository CI completes, while preserving the frozen scientific protocol.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      e4_artifact_id:
        description: "Retained E4 artifact ID containing the frozen checkpoint"
        required: true
        default: "9912441468"
      expected_e4_digest:
        description: "Expected SHA-256 digest of the retained E4 artifact"
        required: true
        default: "sha256:7e6efb89b11d6d04db2eb5da257cd33cb19d93e5223c8e6c93c638308c3e9afa"

permissions:
  contents: read
  actions: read

env:
  E4_ARTIFACT_ID: ${{ inputs.e4_artifact_id || '9912441468' }}
  EXPECTED_E4_DIGEST: ${{ inputs.expected_e4_digest || 'sha256:7e6efb89b11d6d04db2eb5da257cd33cb19d93e5223c8e6c93c638308c3e9afa' }}

jobs:
  external-validation:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install package runtime dependencies without replacing CPU PyTorch
        run: |
          python -m pip install -e . --no-deps
          python -m pip install \
            "numpy>=1.24" \
            "scipy>=1.10" \
            "pandas>=2.0" \
            "scikit-image>=0.21" \
            "scikit-learn>=1.3" \
            "tifffile>=2023.7.10" \
            "pyyaml>=6.0" \
            "tqdm>=4.66"

      - name: Verify runtime
        run: |
          python - <<'PY'
          import pandas, scipy, sklearn, skimage, tifffile, torch, yaml
          print({
              'torch': torch.__version__,
              'cuda_available': torch.cuda.is_available(),
              'pandas': pandas.__version__,
              'scipy': scipy.__version__,
              'sklearn': sklearn.__version__,
              'skimage': skimage.__version__,
              'tifffile': tifffile.__version__,
              'yaml': yaml.__version__,
          })
          assert not torch.cuda.is_available(), 'Unexpected CUDA runtime on CPU validation runner'
          PY

      - name: Verify retained E4 artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${E4_ARTIFACT_ID}" --jq '.digest')"
          echo "Artifact digest: ${digest}"
          test "${digest}" = "${EXPECTED_E4_DIGEST}"

      - name: Download retained E4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${E4_ARTIFACT_ID}/zip" > e4.zip
          unzip -q e4.zip -d e4_artifact
          test -f e4_artifact/outputs/e4_domain_robust/last.pt

      - name: Acquire authoritative BBBC038 stage-1 data
        run: python scripts/download_bbbc038.py --data-root data/raw/BBBC038

      - name: Verify BBBC038 manifest integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/raw/BBBC038/download_manifest.json')
          m=json.loads(p.read_text())
          assert m['dataset']=='BBBC038v1'
          assert m['subset']=='stage1_train'
          assert m['role']=='independent_external_validation'
          assert m['image_count']>0
          assert m['mask_count']>0
          assert not m['image_ids_without_masks'], m['image_ids_without_masks']
          print({'image_count':m['image_count'],'mask_count':m['mask_count']})
          PY

      - name: Run dedicated frozen BBBC038 evaluator
        run: |
          python scripts/evaluate_bbbc038.py \
            --checkpoint e4_artifact/outputs/e4_domain_robust/last.pt \
            --data-root data/raw/BBBC038/extracted \
            --output outputs/e7_bbbc038

      - name: Cross-check E7 machine-readable evidence
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          metrics=Path('outputs/e7_bbbc038/metrics.json')
          manifest=Path('data/raw/BBBC038/download_manifest.json')
          assert metrics.is_file(), metrics
          assert manifest.is_file(), manifest
          r=json.loads(metrics.read_text())
          source=json.loads(manifest.read_text())
          assert r['n_images']==source['image_count']
          assert all(k in r['mean'] for k in ('dice','iou','aji','boundary_f1'))
          assert r['preprocessing']['input_color_to_grayscale'] == 'ITU-R BT.601 luminance coefficients 0.299/0.587/0.114 for RGB inputs'
          assert r['tuning'] == 'none; protocol is evaluation-only'
          digest=hashlib.sha256(metrics.read_bytes()).hexdigest()
          evidence={
              'experiment':'E7_external_BBBC038',
              'checkpoint_artifact_id':str(os.environ['E4_ARTIFACT_ID']),
              'checkpoint_expected_digest':os.environ['EXPECTED_E4_DIGEST'],
              'dataset_manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
              'metrics_sha256':digest,
              'n_images':r['n_images'],
              'mean':r['mean'],
              'adaptation_data_used':False,
              's_biad634_used':False,
          }
          out=Path('outputs/e7_bbbc038'); (out/'provenance.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print('E7 evidence cross-check: PASS')
          PY

      - name: Upload E7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: e7-bbbc038-${{ github.run_id }}
          path: |
            outputs/e7_bbbc038/metrics.json
            outputs/e7_bbbc038/provenance.json
            data/raw/BBBC038/download_manifest.json
          if-no-files-found: error
          retention-days: 30
