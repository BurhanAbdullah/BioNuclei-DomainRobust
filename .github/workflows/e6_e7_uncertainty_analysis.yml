name: E6 E7 uncertainty and failure analysis

# This stage resolves successful, non-expired source artifacts by run/name and
# verifies that E6 and E7 used the same retained frozen E4 checkpoint.
on:
  workflow_run:
    workflows: ["E6 finalize verified evidence"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      e6_finalize_run_id:
        description: "Optional successful E6 finalizer run ID (defaults to latest successful run)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  E4_ARTIFACT_ID: "12183110279"
  EXPECTED_E4_DIGEST: "sha256:89e66617e272d30ec46471c8403950c404c772780ad778dd6f0e992fc795df0d"

jobs:
  analyze:
    name: Image-level uncertainty and failure analysis
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy

      - name: Resolve finalized E6 aggregate and source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.e6_finalize_run_id }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          finalize_run_id="${EVENT_RUN_ID:-${INPUT_RUN_ID:-}}"
          if [ -z "$finalize_run_id" ]; then
            finalize_run_id="$(gh run list --workflow e6_finalize_verified.yml --branch main --status success --json databaseId --limit 1 --jq '.[0].databaseId')"
          fi
          test -n "$finalize_run_id" && test "$finalize_run_id" != "null"
          finalize_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${finalize_run_id}")"
          test "$(jq -r '.conclusion' <<<"$finalize_run")" = "success"
          test "$(jq -r '.head_branch' <<<"$finalize_run")" = "main"
          echo "$finalize_run" > evidence/e6-finalizer-run.json
          finalize_sha="$(jq -r '.head_sha' <<<"$finalize_run")"
          finalize_artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${finalize_run_id}/artifacts?per_page=100")"
          e6_final_id="$(jq -r --arg n "e6-external-few-shot-final-${finalize_run_id}" '[.artifacts[] | select(.name == $n and .expired == false)] | sort_by(.created_at) | if length == 0 then empty else last.id end' <<<"$finalize_artifacts")"
          test -n "$e6_final_id" || { echo "Finalized E6 aggregate artifact missing/expired for run $finalize_run_id"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${e6_final_id}" > evidence/e6-final-artifact-metadata.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${e6_final_id}/zip" > evidence/e6-final.zip
          unzip -q evidence/e6-final.zip -d evidence/e6_final
          aggregate_path="$(find evidence/e6_final -name aggregate_results.json -type f -print -quit)"
          test -n "$aggregate_path"
          python - "$aggregate_path" <<'PY'
          import json, sys
          from pathlib import Path
          p=json.loads(Path(sys.argv[1]).read_text())
          assert p['all_four_fractions_verified'] is True
          assert len(p['fractions']) == 4
          assert p.get('source_run_id')
          assert p.get('e4_checkpoint_artifact_id') == 12183110279
          assert p.get('e4_checkpoint_artifact_digest') == 'sha256:89e66617e272d30ec46471c8403950c404c772780ad778dd6f0e992fc795df0d'
          Path('evidence/e6_source_run_id.txt').write_text(str(p['source_run_id']))
          Path('evidence/e6_source_commit.txt').write_text(str(p['source_commit']))
          print({'source_run_id':p['source_run_id'],'source_commit':p['source_commit'],'fractions':len(p['fractions'])})
          PY
          echo "$finalize_run_id" > evidence/e6_finalize_run_id.txt
          echo "$finalize_sha" > evidence/e6_finalize_commit.txt
          echo "$e6_final_id" > evidence/e6_final_artifact_id.txt

      - name: Download and verify the exact E6 source fractions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run_id="$(cat evidence/e6_source_run_id.txt)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}/artifacts?per_page=100" > evidence/e6-source-artifacts.json
          for label in 01pct 05pct 10pct 25pct; do
            name="e6-fraction-${label}-${source_run_id}"
            artifact_id="$(jq -r --arg n "$name" '[.artifacts[] | select(.name == $n and .expired == false)] | sort_by(.created_at) | if length == 0 then empty else last.id end' evidence/e6-source-artifacts.json)"
            test -n "$artifact_id" || { echo "Missing or expired source artifact $name"; exit 1; }
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > "evidence/e6-${label}-metadata.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "evidence/e6-${label}.zip"
            unzip -q "evidence/e6-${label}.zip" -d "evidence/e6_${label:0:2}"
          done

      - name: Resolve a successful E7 run using the same frozen E4 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > evidence/e7-tried-runs.txt
          selected_run=""
          selected_artifact=""
          # E7 may take longer than E6 to finish. Wait for a successful run
          # whose provenance explicitly names the exact E4 artifact and digest.
          for attempt in $(seq 1 240); do
            run_ids="$(gh run list --workflow e7_bbbc038_external.yml --branch main --status success --json databaseId --limit 25 --jq '.[].databaseId')"
            while IFS= read -r run_id; do
              [ -z "$run_id" ] && continue
              grep -qx "$run_id" evidence/e7-tried-runs.txt && continue
              echo "$run_id" >> evidence/e7-tried-runs.txt
              artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
              artifact_id="$(jq -r --arg n "e7-bbbc038-${run_id}" '[.artifacts[] | select(.name == $n and .expired == false)] | sort_by(.created_at) | if length == 0 then empty else last.id end' <<<"$artifacts")"
              [ -n "$artifact_id" ] || continue
              if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "evidence/e7-candidate.zip"; then
                continue
              fi
              rm -rf evidence/e7_candidate
              mkdir -p evidence/e7_candidate
              if ! unzip -q evidence/e7-candidate.zip -d evidence/e7_candidate; then
                continue
              fi
              match="$(python - "$artifact_id" <<'PY'
          import json, sys
          from pathlib import Path
          target_id='12183110279'
          target_digest='sha256:89e66617e272d30ec46471c8403950c404c772780ad778dd6f0e992fc795df0d'
          matches=[]
          for p in Path('evidence/e7_candidate').rglob('provenance.json'):
              try: obj=json.loads(p.read_text())
              except Exception: continue
              if str(obj.get('checkpoint_artifact_id')) == target_id and obj.get('checkpoint_expected_digest') == target_digest:
                  matches.append(p)
          if len(matches)==1: print('MATCH')
          PY
              )"
              if [ "$match" = "MATCH" ]; then
                selected_run="$run_id"
                selected_artifact="$artifact_id"
                mv evidence/e7_candidate evidence/e7
                gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${selected_artifact}" > evidence/e7-artifact-metadata.json
                break
              fi
            done <<< "$run_ids"
            [ -n "$selected_artifact" ] && break
            echo "No completed E7 artifact matches the frozen E4 checkpoint yet (attempt $attempt/240)."
            sleep 30
          done
          test -n "$selected_artifact" || { echo "No successful E7 artifact matching E4 artifact 12183110279 was found before timeout."; exit 1; }
          echo "$selected_run" > evidence/e7_source_run_id.txt
          echo "$selected_artifact" > evidence/e7_artifact_id.txt
          echo "Selected E7 run $selected_run artifact $selected_artifact"

      - name: Verify evidence layout, provenance, and record exact artifact identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence')
          records={}
          for label, fraction, n in [('01pct',.01,1),('05pct',.05,2),('10pct',.10,3),('25pct',.25,8)]:
              key='e6_'+label[:2]
              provs=sorted(root.joinpath(key).rglob('provenance.json'))
              assert len(provs)==1,(label,provs)
              p=json.loads(provs[0].read_text())
              assert float(p['fraction'])==fraction and int(p['n_adaptation_images'])==n
              assert p['seed']==42 and p['epochs']==20
              assert p.get('activation_checkpointing') is True
              assert p['s_biad634_used_for_adaptation'] is False
              assert p['test_images_used_for_adaptation'] is False
              assert p['development_images_used_for_training_or_selection'] is False
              metrics=provs[0].parent/'evaluation'/'test_metrics.json'
              assert metrics.is_file(),metrics
              m=json.loads(metrics.read_text())
              assert m['n_images']==10
              assert all(x in m['mean'] for x in ('dice','iou','aji','boundary_f1'))
              meta=json.loads(root.joinpath(f'e6-{label}-metadata.json').read_text())
              records[label]={'artifact_id':meta['id'],'name':meta['name'],'digest':meta['digest'],'run_id':meta['workflow_run']['id'],'source_commit':meta['workflow_run']['head_sha']}
          e7_meta=json.loads(root.joinpath('e7-artifact-metadata.json').read_text())
          e7_prov=list(root.joinpath('e7').rglob('provenance.json'))
          e7_metrics=list(root.joinpath('e7').rglob('metrics.json'))
          assert len(e7_prov)==1 and len(e7_metrics)==1
          p7=json.loads(e7_prov[0].read_text()); m7=json.loads(e7_metrics[0].read_text())
          assert str(p7['checkpoint_artifact_id'])=='12183110279'
          assert p7['checkpoint_expected_digest']=='sha256:89e66617e272d30ec46471c8403950c404c772780ad778dd6f0e992fc795df0d'
          assert m7['n_images']==670 and len(m7['per_image'])==670
          records['e7']={'artifact_id':e7_meta['id'],'name':e7_meta['name'],'digest':e7_meta['digest'],'run_id':e7_meta['workflow_run']['id'],'source_commit':e7_meta['workflow_run']['head_sha']}
          final_meta=json.loads(root.joinpath('e6-final-artifact-metadata.json').read_text())
          records['e6_final']={'artifact_id':final_meta['id'],'name':final_meta['name'],'digest':final_meta['digest'],'run_id':final_meta['workflow_run']['id'],'source_commit':final_meta['workflow_run']['head_sha']}
          e4_meta=json.loads(__import__('subprocess').check_output(['gh','api','repos/'+__import__('os').environ['GITHUB_REPOSITORY']+'/actions/artifacts/12183110279'],text=True))
          assert e4_meta['expired'] is False and e4_meta['digest']=='sha256:89e66617e272d30ec46471c8403950c404c772780ad778dd6f0e992fc795df0d'
          metadata={
              'e4_artifact_id':12183110279,'e4_artifact_digest':e4_meta['digest'],
              'e6_source_run_id':int(Path('evidence/e6_source_run_id.txt').read_text()),
              'e6_source_commit':Path('evidence/e6_source_commit.txt').read_text(),
              'e6_finalize_run_id':int(Path('evidence/e6_finalize_run_id.txt').read_text()),
              'e6_final_artifact_id':int(final_meta['id']),
              'e6_final_artifact_digest':final_meta['digest'],
              'e6_fraction_artifacts':records,
              'e7_source_run_id':int(Path('evidence/e7_source_run_id.txt').read_text()),
              'e7_artifact_id':int(e7_meta['id']),
              'e7_artifact_digest':e7_meta['digest'],
              'uncertainty_run_id':int(__import__('os').environ['GITHUB_RUN_ID']),
              'uncertainty_source_commit':__import__('os').environ['GITHUB_SHA'],
          }
          Path('evidence/artifact_metadata.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print('evidence layout/provenance and artifact identity: PASS')
          PY

      - name: Execute image-level uncertainty and failure analysis
        run: |
          python scripts/analyze_e6_e7_uncertainty.py \
            --e6 01pct evidence/e6_01/outputs/e6_external_few_shot/01pct/01pct/evaluation/test_metrics.json \
            --e6 05pct evidence/e6_05/outputs/e6_external_few_shot/05pct/05pct/evaluation/test_metrics.json \
            --e6 10pct evidence/e6_10/outputs/e6_external_few_shot/10pct/10pct/evaluation/test_metrics.json \
            --e6 25pct evidence/e6_25/outputs/e6_external_few_shot/25pct/25pct/evaluation/test_metrics.json \
            --e7 evidence/e7/outputs/e7_bbbc038/metrics.json \
            --metadata evidence/artifact_metadata.json \
            --out outputs/e6_e7_uncertainty_failure_analysis.json \
            --seed 42 \
            --bootstrap-resamples 10000

      - name: Assemble minimal independent reproduction inputs
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          root=Path('evidence')
          bundle=Path('reproduction_bundle')
          for key in ('e6_01','e6_05','e6_10','e6_25'):
              source=root/key
              provs=list(source.rglob('provenance.json'))
              assert len(provs)==1,(key,provs)
              prov=provs[0]
              metrics=prov.parent/'evaluation'/'test_metrics.json'
              assert metrics.is_file()
              for item in (prov,metrics):
                  rel=item.relative_to(source)
                  dest=bundle/'evidence'/key/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(item,dest)
          for pattern in ('provenance.json','metrics.json'):
              for src in root.joinpath('e7').rglob(pattern):
                  if src.name in {'provenance.json','metrics.json'}:
                      dest=bundle/'evidence'/'e7'/src.relative_to(root/'e7')
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copy2(src,dest)
          for src in root.joinpath('e7').rglob('download_manifest.json'):
              dest=bundle/'evidence'/'e7'/src.relative_to(root/'e7')
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dest)
          (bundle/'evidence').mkdir(parents=True,exist_ok=True)
          shutil.copy2(root/'artifact_metadata.json',bundle/'evidence'/'artifact_metadata.json')
          (bundle/'retained-analysis').mkdir(parents=True,exist_ok=True)
          shutil.copy2('outputs/e6_e7_uncertainty_failure_analysis.json',bundle/'retained-analysis'/'e6_e7_uncertainty_failure_analysis.json')
          print('Minimal reproducibility bundle assembled; no checkpoint or uploaded microscopy data copied.')
          PY

      - name: Upload uncertainty analysis and independent reproduction inputs
        uses: actions/upload-artifact@v4
        with:
          name: e6-e7-uncertainty-failure-analysis-${{ github.run_id }}
          path: |
            outputs/e6_e7_uncertainty_failure_analysis.json
            reproduction_bundle/**
          if-no-files-found: error
          retention-days: 90
