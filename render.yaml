services:
  - type: web
    name: bionuclei-api
    runtime: docker
    plan: starter
    dockerfilePath: ./webapp/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BIONUCLEI_CHECKPOINT
        sync: false
      - key: BIONUCLEI_CHECKPOINT_SHA256
        value: "7209a6990514380804210292ac208b0f3b0b0a054338a145e1916044762d7c92"
      - key: BIONUCLEI_ALLOWED_ORIGINS
        value: https://burhanabdullah.github.io
      - key: BIONUCLEI_MAX_UPLOAD_BYTES
        value: "67108864"

  - type: web
    name: bionuclei-community
    runtime: docker
    plan: starter
    dockerfilePath: ./webapp/community.Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: bionuclei-community-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: BIONUCLEI_CHECKPOINT
        sync: false
      - key: BIONUCLEI_CHECKPOINT_SHA256
        value: "7209a6990514380804210292ac208b0f3b0b0a054338a145e1916044762d7c92"
      - key: BIONUCLEI_JOB_DIR
        value: /data/bionuclei-community-jobs
      - key: BIONUCLEI_ALLOWED_ORIGINS
        value: https://burhanabdullah.github.io
      - key: BIONUCLEI_MAX_UPLOAD_BYTES
        value: "67108864"
      - key: BIONUCLEI_RESULT_RETENTION_HOURS
        value: "24"
      - key: BIONUCLEI_RESEARCH_RETENTION_DAYS
        value: "90"
